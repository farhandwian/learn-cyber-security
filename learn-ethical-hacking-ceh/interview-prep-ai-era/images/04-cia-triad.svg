<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="410.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="410.0" dy="0">The CIA triad</tspan></text><text x="410.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="410.0" dy="0">The three things security protects. Every attack breaks at least one.</tspan></text><rect x="295" y="75" width="230" height="64" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="410.0" y="95.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="410.0" dy="0">CONFIDENTIALITY</tspan><tspan x="410.0" dy="16.2">only the right people can</tspan><tspan x="410.0" dy="16.2">read it</tspan></text><rect x="50" y="285" width="230" height="64" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="165.0" y="305.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="165.0" dy="0">INTEGRITY</tspan><tspan x="165.0" dy="16.2">data is not changed behind</tspan><tspan x="165.0" dy="16.2">your back</tspan></text><rect x="540" y="285" width="230" height="64" rx="10" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.6"/><text x="655.0" y="313.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="655.0" dy="0">AVAILABILITY</tspan><tspan x="655.0" dy="16.2">the system works when needed</tspan></text><line x1="350" y1="139" x2="200" y2="285" stroke="#5b6b79" stroke-width="2"/><line x1="470" y1="139" x2="620" y2="285" stroke="#5b6b79" stroke-width="2"/><line x1="280" y1="317" x2="540" y2="317" stroke="#5b6b79" stroke-width="2"/><circle cx="410" cy="225" r="42" fill="#fdf3e0" stroke="#c77d0a" stroke-width="2"/><text x="410" y="230.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="410" dy="0">DATA</tspan></text><text x="545" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="545" dy="0">Broken when: a database leaks</tspan><tspan x="545" dy="15.6">to strangers.</tspan></text><text x="50" y="375" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Broken when: someone silently</tspan><tspan x="50" dy="15.6">edits a bank balance.</tspan></text><text x="540" y="375" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="540" dy="0">Broken when: ransomware or a DDoS</tspan><tspan x="540" dy="15.6">takes the site down.</tspan></text></svg>