<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">The 5 phases of an attack</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Also a great structure for 'walk me through how an attacker would...' answers</tspan></text><rect x="20" y="75" width="152" height="48" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="96.0" y="103.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="96.0" dy="0">1  RECON</tspan></text><line x1="174" y1="99" x2="185" y2="99" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="133" width="152" height="88" rx="8" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="30" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">LIKE A BURGLAR</tspan></text><text x="30" y="168" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Watches the house</tspan><tspan x="30" dy="14.7">from the street</tspan></text><rect x="20" y="229" width="152" height="88" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="30" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">IN THE IT WORLD</tspan></text><text x="30" y="264" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">whois, DNS,</tspan><tspan x="30" dy="14.7">LinkedIn, Shodan</tspan></text><rect x="20" y="325" width="152" height="78" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="30" y="342" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">DEFENDER'S MOVE</tspan></text><text x="30" y="360" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Share less publicly</tspan></text><rect x="187" y="75" width="152" height="48" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="263.0" y="103.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="263.0" dy="0">2  SCANNING</tspan></text><line x1="341" y1="99" x2="352" y2="99" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="187" y="133" width="152" height="88" rx="8" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="197" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">LIKE A BURGLAR</tspan></text><text x="197" y="168" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Tries which doors</tspan><tspan x="197" dy="14.7">and windows are</tspan><tspan x="197" dy="14.7">unlocked</tspan></text><rect x="187" y="229" width="152" height="88" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="197" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">IN THE IT WORLD</tspan></text><text x="197" y="264" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">nmap: open ports</tspan><tspan x="197" dy="14.7">and service</tspan><tspan x="197" dy="14.7">versions</tspan></text><rect x="187" y="325" width="152" height="78" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="197" y="342" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">DEFENDER'S MOVE</tspan></text><text x="197" y="360" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Close unused ports;</tspan><tspan x="197" dy="14.7">firewall</tspan></text><rect x="354" y="75" width="152" height="48" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="430.0" y="103.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">3  GAIN ACCESS</tspan></text><line x1="508" y1="99" x2="519" y2="99" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="354" y="133" width="152" height="88" rx="8" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="364" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">LIKE A BURGLAR</tspan></text><text x="364" y="168" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Picks the lock and</tspan><tspan x="364" dy="14.7">walks in</tspan></text><rect x="354" y="229" width="152" height="88" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="364" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">IN THE IT WORLD</tspan></text><text x="364" y="264" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">SQL injection,</tspan><tspan x="364" dy="14.7">stolen password,</tspan><tspan x="364" dy="14.7">unpatched bug</tspan></text><rect x="354" y="325" width="152" height="78" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="364" y="342" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">DEFENDER'S MOVE</tspan></text><text x="364" y="360" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Patch, validate</tspan><tspan x="364" dy="14.7">input, MFA</tspan></text><rect x="521" y="75" width="152" height="48" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="597.0" y="103.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="597.0" dy="0">4  MAINTAIN</tspan></text><line x1="675" y1="99" x2="686" y2="99" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="521" y="133" width="152" height="88" rx="8" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="531" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="531" dy="0">LIKE A BURGLAR</tspan></text><text x="531" y="168" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="531" dy="0">Copies a key to get</tspan><tspan x="531" dy="14.7">back in later</tspan></text><re