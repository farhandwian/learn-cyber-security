></text><rect x="688" y="229" width="152" height="88" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="698" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">IN THE IT WORLD</tspan></text><text x="698" y="264" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Deleting or editing</tspan><tspan x="698" dy="14.7">log files</tspan></text><rect x="688" y="325" width="152" height="78" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="698" y="342" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">DEFENDER'S MOVE</tspan></text><text x="698" y="360" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Ship logs to a</tspan><tspan x="698" dy="14.7">separate server</tspan></text></svg>