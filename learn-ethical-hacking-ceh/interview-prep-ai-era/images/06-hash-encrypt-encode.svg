<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 405" width="860" height="405"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a1b8a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a9a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Encoding vs encryption vs hashing</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Three different tools. Mixing them up is the classic beginner mistake.</tspan></text><rect x="15" y="80" width="830" height="94" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="30" y="116" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">ENCODING</tspan></text><text x="30" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">changes the format</tspan></text><rect x="185" y="94" width="80" height="42" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="225.0" y="119.5" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="225.0" dy="0">hello</tspan></text><line x1="267" y1="115" x2="303" y2="115" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><rect x="305" y="94" width="130" height="42" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="370.0" y="119.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="370.0" dy="0">Base64</tspan></text><line x1="437" y1="115" x2="473" y2="115" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><rect x="475" y="94" width="150" height="42" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="550.0" y="119.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="550.0" dy="0">aGVsbG8=</tspan></text><line x1="475" y1="157" x2="225" y2="157" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a2e8b57)"/><rect x="269.1" y="147.25" width="161.79999999999998" height="19.5" rx="4" fill="#fdf3e0"/><text x="350" y="161.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="350" dy="0">decode (no key needed)</tspan></text><text x="645" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="645" dy="0">Anyone can reverse it.</tspan><tspan x="645" dy="15.6">Not security.</tspan></text><rect x="15" y="186" width="830" height="94" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="30" y="222" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">ENCRYPTION</tspan></text><text x="30" y="242" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">hides the content</tspan></text><rect x="185" y="200" width="80" height="42" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="225.0" y="225.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="225.0" dy="0">hello</tspan></text><line x1="267" y1="221" x2="303" y2="221" stroke="#1b8a9a" stroke-width="2" marker-end="url(#a1b8a9a)"/><rect x="305" y="200" width="130" height="42" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="370.0" y="225.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="370.0" dy="0">AES + secret key</tspan></text><line x1="437" y1="221" x2="473" y2="221" stroke="#1b8a9a" stroke-width="2" marker-end="url(#a1b8a9a)"/><rect x="475" y="200" width="150" height="42" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="550.0" y="225.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="550.0" dy="0">9f3a7c…e1</tspan></text><line x1="475" y1="263" x2="225" y2="263" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a2e8b57)"/><rect x="269.1" y="253.25" width="161.79999999999998" height="19.5" rx="4" fill="#e6f3f7"/><text x="350" y="267.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="350" dy="0">decrypt (key required)</tspan></text><text x="645" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="645" dy="0">Only the key holder can</tspan><tspan x="645" dy="15.6">reverse it.</tspan><tspan x="645" dy="15.6">Use for confidentiality.</tspan></text><rect x="15" y="292" width="830" height="94" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="30" y="328" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">HASHING</tspan></text><text x="30" y="348" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">fingerprints the content</tspan></text><rect x="185" y="306" width="80" height="42" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="225.0" y="331.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="225.0" dy="0">hello</tspan></text><line x1="267" y1="327" x2="303" y2="327" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><rect x="305" y="306" width="130" height="42" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="370.0" y="331.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="370.0" dy="0">SHA-256</tspan></text><line x1="437" y1="327" x2="473" y2="327" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><rect x="475" y="306" width="150" height="42" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="550.0" y="331.0" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="550.0" dy="0">2cf24dba5fb0…</tspan></text><line x1="475" y1="369" x2="225" y2="369" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><rect x="276.0" y="359.25" width="148.0" height="19.5" rx="4" fill="#e7f5ec"/><text x="350" y="373.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="350" dy="0">✗ cannot be reversed</tspan></text><text x="645" y="322" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="645" dy="0">One-way. Same input, same</tspan><tspan x="645" dy="15.6">output.</tspan><tspan x="645" dy="15.6">Use for integrity and</tspan><tspan x="645" dy="15.6">passwords.</tspan></text></svg>