<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 425" width="860" height="425"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Symmetric vs asymmetric encryption</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Symmetric is fast but has a key-sharing problem. Asymmetric solves sharing but is slower.</tspan></text><rect x="15" y="70" width="410" height="270" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="220" y="97" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">SYMMETRIC  (e.g. AES)</tspan></text><rect x="40" y="150" width="100" height="50" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="90.0" y="179.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="90.0" dy="0">Alice</tspan></text><rect x="300" y="150" width="100" height="50" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="350.0" y="179.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="350.0" dy="0">Bob</tspan></text><line x1="142" y1="175" x2="298" y2="175" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220" y="163" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220" dy="0">encrypted message</tspan></text><rect x="63.4" y="117.5" width="53.2" height="21" rx="10.5" fill="#c77d0a"/><text x="90" y="131.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="90" dy="0">KEY K</tspan></text><rect x="323.4" y="117.5" width="53.2" height="21" rx="10.5" fill="#c77d0a"/><text x="350" y="131.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="350" dy="0">KEY K</tspan></text><line x1="130" y1="128" x2="310" y2="128" stroke="#c77d0a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220" y="232" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">Both sides use the SAME key.</tspan></text><text x="220" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">✔ very fast</tspan></text><text x="220" y="284" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">✘ how do you share K safely in the first place?</tspan></text><rect x="435" y="70" width="410" height="270" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="640" y="97" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">ASYMMETRIC  (e.g. RSA, ECC)</tspan></text><rect x="455" y="150" width="90" height="50" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="500.0" y="179.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="500.0" dy="0">Alice</tspan></text><rect x="745" y="150" width="90" height="50" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="790.0" y="179.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="790.0" dy="0">Bob</tspan></text><line x1="547" y1="175" x2="743" y2="175" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="645" y="163" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="645" dy="0">locked with the PUBLIC key</tspan></text><rect x="437.24" y="117.75" width="125.52" height="20.5" rx="10.25" fill="#2e8b57"/><text x="500" y="131.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="500" dy="0">Bob's PUBLIC key</tspan></text><rect x="701.88" y="117.75" width="132.24" height="20.5" rx="10.25" fill="#c0392b"/><text x="768" y="131.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="768" dy="0">Bob's PRIVATE key</tspan></text><text x="640" y="232" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">Anyone can lock; only Bob can unlock.</tspan></text><text x="640" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">✔ no secret has to be shared</tspan></text><text x="640" y="284" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">✘ much slower</tspan></text><rect x="15" y="358" width="830" height="48" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="378.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">TLS uses BOTH: asymmetric crypto to agree on a secret, then fast symmetric encryption for the real</tspan><tspan x="430" dy="16.2">traffic.</tspan></text></svg>