<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">The TCP handshake, and how nmap reads it</tspan></text><rect x="15" y="50" width="410" height="345" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="220" y="76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">Normal 3-way handshake</tspan></text><rect x="435" y="50" width="410" height="345" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="640" y="76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">nmap's SYN scan (half-open)</tspan></text><rect x="45" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="95.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">Client</tspan></text><line x1="95" y1="124" x2="95" y2="290" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="295" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="345.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="345.0" dy="0">Server</tspan></text><line x1="345" y1="124" x2="345" y2="290" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="98" y1="160" x2="342" y2="160" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">SYN  ("can we talk?")</tspan></text><line x1="342" y1="215" x2="98" y2="215" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="206" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">SYN/ACK  ("yes, can you?")</tspan></text><line x1="98" y1="270" x2="342" y2="270" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">ACK  ("yes")</tspan></text><rect x="40" y="322" width="350" height="44" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="215.0" y="348.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="215.0" dy="0">Connection established: data flows</tspan></text><rect x="470" y="90" width="100" height="34" rx="10" fill="#c77d0a" stroke="#c77d0a" stroke-width="1.6"/><text x="520.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="520.0" dy="0">Scanner</tspan></text><line x1="520" y1="124" x2="520" y2="330" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="730" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="780.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="780.0" dy="0">Target</tspan></text><line x1="780" y1="124" x2="780" y2="330" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><text x="455" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="455" dy="0">Open port (443)</tspan></text><line x1="525" y1="172" x2="775" y2="172" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="650.0" y="165" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650.0" dy="0">SYN</tspan></text><line x1="775" y1="204" x2="525" y2="204" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="650.0" y="197" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650.0" dy="0">SYN/ACK = OPEN</tspan></text><line x1="525" y1="236" x2="775" y2="236" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><text x="650.0" y="229" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650.0" dy="0">RST (hangs up, no final ACK)</tspan></text><text x="455" y="268" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="455" dy="0">Closed port (81)</tspan></text><line x1="525" y1="288" x2="775" y2="288" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="650.0" y="281" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650.0" dy="0">SYN</tspan></text><line x1="775" y1="320" x2="525" y2="320" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="650.0" y="313" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650.0" dy="0">RST = CLOSED</tspan></text><text x="640" y="372" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Never completing the handshake means many services never</tspan><tspan x="640" dy="15.0">log the probe.</tspan></text><rect x="15" y="408" width="830" height="34" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="429.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Why it matters: the handshake explains how connections start and how scanners read the reply.</tspan></text></svg>