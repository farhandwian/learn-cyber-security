<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Stored XSS: the attacker's script runs in your visitors' browsers</tspan></text><rect x="58" y="55" width="144" height="40" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="130.0" y="79.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="130.0" dy="0">Attacker</tspan></text><line x1="130" y1="95" x2="130" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="358" y="55" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="430.0" y="70.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Website +</tspan><tspan x="430.0" dy="17.6">database</tspan></text><line x1="430" y1="95" x2="430" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="658" y="55" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="730.0" y="79.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">Victim's browser</tspan></text><line x1="730" y1="95" x2="730" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="133" y1="130" x2="427" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="280.0" y="121" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">1  posts a comment that contains a script</tspan></text><rect x="310" y="160" width="240" height="44" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430.0" y="178.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">2  Site stores it as-is (no</tspan><tspan x="430.0" dy="15.6">output encoding)</tspan></text><line x1="727" y1="245" x2="433" y2="245" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="580.0" y="236" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">3  opens the page with the comments</tspan></text><line x1="433" y1="295" x2="727" y2="295" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="580.0" y="286" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">4  sends the page, including the attacker's script</tspan></text><rect x="520" y="325" width="330" height="56" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="685.0" y="341.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="685.0" dy="0">5  The browser runs the script as if the</tspan><tspan x="685.0" dy="15.6">site itself wrote it. It can act as the</tspan><tspan x="685.0" dy="15.6">victim on this site.</tspan></text><rect x="15" y="452" width="830" height="62" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="487.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses:  encode output  ·  Content-Security-Policy  ·  HttpOnly cookies  ·  framework auto-escaping</tspan></text></svg>