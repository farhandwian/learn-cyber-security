<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 478" width="860" height="478"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">SSRF: tricking the server into making requests for you</tspan></text><rect x="15" y="60" width="250" height="290" rx="12" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6" stroke-dasharray="6 4"/><text x="140" y="82" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#5b6b79" font-weight="bold" text-anchor="middle"><tspan x="140" dy="0">Internet</tspan></text><rect x="285" y="60" width="270" height="290" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="420" y="82" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="420" dy="0">Your public web app</tspan></text><rect x="575" y="60" width="270" height="290" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="710" y="82" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="710" dy="0">Internal network (unreachable from</tspan><tspan x="710" dy="14.3">outside)</tspan></text><rect x="40" y="175" width="200" height="70" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="140.0" y="214.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="140.0" dy="0">Attacker</tspan></text><rect x="305" y="150" width="230" height="120" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="420.0" y="198.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="420.0" dy="0">Feature: "give me a URL and I</tspan><tspan x="420.0" dy="15.6">will fetch a preview"</tspan><tspan x="420.0" dy="15.6">(the SERVER makes the request)</tspan></text><rect x="595" y="150" width="230" height="120" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="710.0" y="198.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="710.0" dy="0">Internal admin panel or</tspan><tspan x="710.0" dy="15.6">cloud metadata service</tspan><tspan x="710.0" dy="15.6">(169.254.169.254)</tspan></text><path d="M140,173 V112 H710 V148" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><rect x="285.45000000000005" y="102.25" width="279.09999999999997" height="19.5" rx="4" fill="#ffffff"/><text x="425" y="116.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="425" dy="0">✗ direct access blocked by the firewall</tspan></text><line x1="242" y1="195" x2="303" y2="195" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="259.48" y="169.5" width="25.04" height="21" rx="10.5" fill="#c0392b"/><text x="272" y="183.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="272" dy="0">1</tspan></text><line x1="537" y1="205" x2="593" y2="205" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="552.48" y="179.5" width="25.04" height="21" rx="10.5" fill="#c0392b"/><text x="565" y="193.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="565" dy="0">2</tspan></text><line x1="593" y1="235" x2="537" y2="235" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><line x1="303" y1="235" x2="242" y2="235" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><rect x="259.48" y="241.5" width="25.04" height="21" rx="10.5" fill="#c0392b"/><text x="272" y="255.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="272" dy="0">3</tspan></text><text x="20" y="374" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">1  The attacker submits an internal URL.</tspan><tspan x="20" dy="15.5">2  The server, which IS trusted inside, fetches it.</tspan><tspan x="20" dy="15.5">3  The answer comes back to the attacker.</tspan></text><rect x="15" y="425" width="830" height="40" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="441.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses:  allowlist destinations  ·  block private and link-local IPs  ·  never fetch raw user URLs  ·  protect the</tspan><tspan x="430" dy="15.0">metadata service</tspan></text></svg>