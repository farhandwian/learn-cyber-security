<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a1b8a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a9a"/></marker><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Incident response in five steps</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">If you suspect a breach, say these out loud in this order</tspan></text><rect x="20" y="75" width="152" height="130" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,109 L20,85 Q20,75 30,75 L162,75 Q172,75 172,85 L172,109 Z" fill="#12304a"/><text x="96.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="96.0" dy="0">1  IDENTIFY</tspan></text><text x="32" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Is it real? How</tspan><tspan x="32" dy="16.2">big is it? What</tspan><tspan x="32" dy="16.2">is affected?</tspan></text><line x1="174" y1="140" x2="185" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="187" y="75" width="152" height="130" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M187,109 L187,85 Q187,75 197,75 L329,75 Q339,75 339,85 L339,109 Z" fill="#c0392b"/><text x="263.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="263.0" dy="0">2  CONTAIN</tspan></text><text x="199" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="199" dy="0">Isolate systems,</tspan><tspan x="199" dy="16.2">revoke</tspan><tspan x="199" dy="16.2">credentials, stop</tspan><tspan x="199" dy="16.2">the spread.</tspan></text><line x1="341" y1="140" x2="352" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="354" y="75" width="152" height="130" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><path d="M354,109 L354,85 Q354,75 364,75 L496,75 Q506,75 506,85 L506,109 Z" fill="#c77d0a"/><text x="430.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">3  ERADICATE</tspan></text><text x="366" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="366" dy="0">Remove the cause:</tspan><tspan x="366" dy="16.2">malware, rogue</tspan><tspan x="366" dy="16.2">account,</tspan><tspan x="366" dy="16.2">vulnerable code.</tspan></text><line x1="508" y1="140" x2="519" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="521" y="75" width="152" height="130" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M521,109 L521,85 Q521,75 531,75 L663,75 Q673,75 673,85 L673,109 Z" fill="#2e8b57"/><text x="597.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="597.0" dy="0">4  RECOVER</tspan></text><text x="533" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="533" dy="0">Restore from</tspan><tspan x="533" dy="16.2">clean backups;</tspan><tspan x="533" dy="16.2">monitor closely.</tspan></text><line x1="675" y1="140" x2="686" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="688" y="75" width="152" height="130" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M688,109 L688,85 Q688,75 698,75 L830,75 Q840,75 840,85 L840,109 Z" fill="#1b8a9a"/><text x="764.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="764.0" dy="0">5  LEARN</tspan></text><text x="700" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="700" dy="0">Blameless post-</tspan><tspan x="700" dy="16.2">mortem; fix the</tspan><tspan x="700" dy="16.2">root cause.</tspan></text><path d="M772,207 V240 H96 V209" fill="none" stroke="#1b8a9a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a1b8a9a)"/><rect x="287.55" y="230.25" width="292.9" height="19.5" rx="4" fill="#ffffff"/><text x="434" y="244.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="434" dy="0">what you learn improves the next response</tspan></text><rect x="20" y="268" width="825" height="42" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="432" y="285.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="432" dy="0">Before anything happens: logging, backups, runbooks, and a named person on call. Preserve evidence; do not just</tspan><tspan x="432" dy="15.6">reboot everything.</tspan></text></svg>