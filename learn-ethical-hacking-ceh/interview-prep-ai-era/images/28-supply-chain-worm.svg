<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">A supply-chain worm: how one poisoned package spreads</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">The pattern seen in the Shai-Hulud npm worm (2025) and the 2026 attacks on developer tools</tspan></text><rect x="20" y="75" width="190" height="130" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M20,109 L20,85 Q20,75 30,75 L200,75 Q210,75 210,85 L210,109 Z" fill="#c0392b"/><text x="115.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="115.0" dy="0">1  INSTALL</tspan></text><text x="32" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">A developer machine or</tspan><tspan x="32" dy="16.2">build server installs a</tspan><tspan x="32" dy="16.2">poisoned package.</tspan></text><line x1="212" y1="140" x2="229" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="232" y="75" width="190" height="130" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M232,109 L232,85 Q232,75 242,75 L412,75 Q422,75 422,85 L422,109 Z" fill="#c0392b"/><text x="327.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="327.0" dy="0">2  STEAL</tspan></text><text x="244" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="244" dy="0">An install script grabs</tspan><tspan x="244" dy="16.2">tokens and secrets:</tspan><tspan x="244" dy="16.2">npm, GitHub, cloud</tspan><tspan x="244" dy="16.2">keys.</tspan></text><line x1="424" y1="140" x2="441" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="444" y="75" width="190" height="130" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M444,109 L444,85 Q444,75 454,75 L624,75 Q634,75 634,85 L634,109 Z" fill="#c0392b"/><text x="539.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="539.0" dy="0">3  REPUBLISH</tspan></text><text x="456" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="456" dy="0">The attacker uses a</tspan><tspan x="456" dy="16.2">stolen publish token to</tspan><tspan x="456" dy="16.2">push bad versions of</tspan><tspan x="456" dy="16.2">the victim's own</tspan><tspan x="456" dy="16.2">packages.</tspan></text><line x1="636" y1="140" x2="653" y2="140" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="656" y="75" width="190" height="130" rx="10" fill="#ffffff" stroke="#8e1b12" stroke-width="1.6"/><path d="M656,109 L656,85 Q656,75 666,75 L836,75 Q846,75 846,85 L846,109 Z" fill="#8e1b12"/><text x="751.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="751.0" dy="0">4  SPREAD</tspan></text><text x="668" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="668" dy="0">Everyone who installs</tspan><tspan x="668" dy="16.2">those versions repeats</tspan><tspan x="668" dy="16.2">step 1.</tspan></text><path d="M783,207 V240 H115 V209" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><rect x="340.5" y="230.25" width="217.0" height="19.5" rx="4" fill="#ffffff"/><text x="449" y="244.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="449" dy="0">repeat: it spreads like a worm</tspan></text><text x="20" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Defenses that matter most for developers</tspan></text><rect x="20" y="292" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="154.0" y="315.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="154.0" dy="0">Commit lockfiles and install exact</tspan><tspan x="154.0" dy="15.6">versions</tspan></text><rect x="302" y="292" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="436.0" y="315.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="436.0" dy="0">Delay adopting brand-new versions</tspan><tspan x="436.0" dy="15.6">(a few days' cooldown)</tspan></text><rect x="584" y="292" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="718.0" y="323.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="718.0" dy="0">Block or review install scripts</tspan></text><rect x="20" y="358" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="154.0" y="381.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="154.0" dy="0">Short-lived publish tokens, MFA,</tspan><tspan x="154.0" dy="15.6">trusted publishing</tspan></text><rect x="302" y="358" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="436.0" y="381.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="436.0" dy="0">Rotate secrets quickly after any</tspan><tspan x="436.0" dy="15.6">alert</tspan></text><rect x="584" y="358" width="268" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="718.0" y="381.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="718.0" dy="0">CI with least privilege: no secrets</tspan><tspan x="718.0" dy="15.6">for untrusted pull requests</tspan></text><text x="20" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">Also remember XZ Utils (2024): a patient attacker became a maintainer and hid a backdoor in releases, so even trusted</tspan><tspan x="20" dy="15.0">maintainers are a risk.</tspan></text></svg>