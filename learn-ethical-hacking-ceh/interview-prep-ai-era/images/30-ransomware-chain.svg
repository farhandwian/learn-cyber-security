<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">The modern ransomware chain</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">It usually starts with access someone else already has: a flaw, a stolen login, or a convincing phone call</tspan></text><rect x="20" y="80" width="152" height="46" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="96.0" y="107.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="96.0" dy="0">1  INITIAL ACCESS</tspan></text><line x1="174" y1="103" x2="185" y2="103" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="136" width="152" height="100" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="30" y="153" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">WHAT ATTACKERS DO</tspan></text><text x="30" y="171" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Edge-device flaw,</tspan><tspan x="30" dy="14.7">stolen login,</tspan><tspan x="30" dy="14.7">phishing, or a call</tspan><tspan x="30" dy="14.7">to the help desk</tspan></text><rect x="20" y="244" width="152" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="30" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">DEFENDER'S MOVE</tspan></text><text x="30" y="279" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Patch edge devices</tspan><tspan x="30" dy="14.7">fast; phishing-</tspan><tspan x="30" dy="14.7">resistant MFA</tspan></text><rect x="187" y="80" width="152" height="46" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="263.0" y="107.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="263.0" dy="0">2  TAKE CONTROL</tspan></text><line x1="341" y1="103" x2="352" y2="103" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="187" y="136" width="152" height="100" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="197" y="153" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">WHAT ATTACKERS DO</tspan></text><text x="197" y="171" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Steal admin rights;</tspan><tspan x="197" dy="14.7">abuse remote-</tspan><tspan x="197" dy="14.7">management tools</tspan></text><rect x="187" y="244" width="152" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="197" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">DEFENDER'S MOVE</tspan></text><text x="197" y="279" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Least privilege;</tspan><tspan x="197" dy="14.7">alerts on new admin</tspan><tspan x="197" dy="14.7">activity (EDR)</tspan></text><rect x="354" y="80" width="152" height="46" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="107.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">3  SPREAD</tspan></text><line x1="508" y1="103" x2="519" y2="103" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="354" y="136" width="152" height="100" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="364" y="153" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">WHAT ATTACKERS DO</tspan></text><text x="364" y="171" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Move across the</tspan><tspan x="364" dy="14.7">network, often</tspan><tspan x="364" dy="14.7">within hours or</tspan><tspan x="364" dy="14.7">days</tspan></text><rect x="354" y="244" width="152" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="364" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">DEFENDER'S MOVE</tspan></text><text x="364" y="279" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Segment the</tspan><tspan x="364" dy="14.7">network; restrict</tspan><tspan x="364" dy="14.7">admin tools</tspan></text><rect x="521" y="80" width="152" height="46" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="597.0" y="107.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="597.0" dy="0">4  STEAL DATA</tspan></text><line x1="675" y1="103" x2="686" y2="103" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="521" y="136" width="152" height="100" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="531" y="153" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="531" dy="0">WHAT ATTACKERS DO</tspan></text><text x="531" y="171" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="531" dy="0">Copy data out</tspan><tspan x="531" dy="14.7">first, so there is</tspan><tspan x="531" dy="14.7">leverage even if</tspan><tspan x="531" dy="14.7">you restore</tspan></text><rect x="521" y="244" width="152" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="531" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="531" dy="0">DEFENDER'S MOVE</tspan></text><text x="531" y="279" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="531" dy="0">Watch outbound</tspan><tspan x="531" dy="14.7">traffic; limit who</tspan><tspan x="531" dy="14.7">can read what</tspan></text><rect x="688" y="80" width="152" height="46" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="764.0" y="107.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="764.0" dy="0">5  ENCRYPT + EXTORT</tspan></text><rect x="688" y="136" width="152" height="100" rx="8" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="698" y="153" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">WHAT ATTACKERS DO</tspan></text><text x="698" y="171" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Lock systems and</tspan><tspan x="698" dy="14.7">threaten to leak</tspan><tspan x="698" dy="14.7">the data</tspan></text><rect x="688" y="244" width="152" height="92" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="698" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">DEFENDER'S MOVE</tspan></text><text x="698" y="279" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Offline, tested</tspan><tspan x="698" dy="14.7">backups; a</tspan><tspan x="698" dy="14.7">practised incident</tspan><tspan x="698" dy="14.7">plan</tspan></text><rect x="15" y="350" width="830" height="50" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="371.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Verizon DBIR 2026 (as reported): ransomware was present in 48% of breaches; 69% of ransomware victims did not</tspan><tspan x="430" dy="15.6">pay; the median payment was about $140,000.</tspan></text></svg>