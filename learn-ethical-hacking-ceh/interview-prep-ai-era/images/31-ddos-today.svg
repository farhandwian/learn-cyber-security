<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">DDoS in 2026: what the data shows</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Cloudflare DDoS Threat Report, first half of 2026</tspan></text><rect x="20" y="72" width="270" height="168" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,108 L20,82 Q20,72 30,72 L280,72 Q290,72 290,82 L290,108 Z" fill="#12304a"/><text x="155.0" y="94.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="155.0" dy="0">Network-layer floods</tspan></text><text x="32" y="129" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">23.2 million attacks in H1 2026.</tspan><tspan x="32" dy="16.2">DNS-based attacks (floods and</tspan><tspan x="32" dy="16.2">amplification) were 34.3% of them,</tspan><tspan x="32" dy="16.2">and reflection floods such as</tspan><tspan x="32" dy="16.2">CLDAP are growing fast.</tspan></text><rect x="305" y="72" width="270" height="168" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M305,108 L305,82 Q305,72 315,72 L565,72 Q575,72 575,82 L575,108 Z" fill="#c0392b"/><text x="440.0" y="94.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Hyper-volumetric</tspan></text><text x="317" y="129" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="317" dy="0">935 attacks above 1 Tbps in H1</tspan><tspan x="317" dy="16.2">2026, 805 of them in Q2 alone: six</tspan><tspan x="317" dy="16.2">times the previous quarter.</tspan></text><rect x="590" y="72" width="270" height="168" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M590,108 L590,82 Q590,72 600,72 L850,72 Q860,72 860,82 L860,108 Z" fill="#1b8a9a"/><text x="725.0" y="94.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="725.0" dy="0">Application-layer (HTTP)</tspan></text><text x="602" y="129" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="602" dy="0">29.64 trillion malicious HTTP</tspan><tspan x="602" dy="16.2">requests in H1 2026. HTTP/2 Rapid</tspan><tspan x="602" dy="16.2">Reset (2023) peaked near 398</tspan><tspan x="602" dy="16.2">million requests per second at</tspan><tspan x="602" dy="16.2">Google.</tspan></text><rect x="20" y="254" width="840" height="44" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="440" y="272.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Most attacks are small and short: 96.62% of network-layer attacks stayed under 500 Mbps and 90.60% ended within</tspan><tspan x="440" dy="15.6">10 minutes.</tspan></text><rect x="20" y="310" width="840" height="44" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="440" y="328.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Defenses: CDN or scrubbing provider (anycast)  ·  rate limiting  ·  cache what you can  ·  hide your origin IP</tspan><tspan x="440" dy="15.6">·  a practised runbook</tspan></text><text x="20" y="380" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">SYN floods are not named in the report. Learn the idea in one line, and spend your time on DNS, reflection and HTTP</tspan><tspan x="20" dy="15.0">floods.</tspan></text></svg>