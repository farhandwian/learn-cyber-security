<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Agent permission ladder: start low, raise on purpose</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Match the autonomy to the blast radius</tspan></text><rect x="20" y="285" width="380" height="52" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="34" y="307" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">1  Read-only</tspan></text><text x="34" y="326" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="34" dy="0">Explain, search, plan</tspan></text><rect x="40" y="223" width="400" height="52" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="54" y="245" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="54" dy="0">2  Edit with approval</tspan></text><text x="54" y="264" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="54" dy="0">You approve each write and command</tspan></text><rect x="60" y="161" width="420" height="52" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="74" y="183" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="74" dy="0">3  Auto in a sandbox</tspan></text><text x="74" y="202" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="74" dy="0">Container or VM, no real secrets, no prod network</tspan></text><rect x="80" y="99" width="440" height="52" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="94" y="121" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="94" dy="0">4  Full auto on your machine</tspan></text><text x="94" y="140" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="94" dy="0">Your files, your tokens, your shell</tspan></text><rect x="540" y="90" width="320" height="150" rx="12" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="556" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="556" dy="0">Rules of thumb</tspan></text><text x="556" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="556" dy="0">•</tspan></text><text x="570" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="570" dy="0">Rungs 3 and 4 are where incidents happen</tspan></text><text x="556" y="157.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="556" dy="0">•</tspan></text><text x="570" y="157.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="570" dy="0">Never run rung 4 on a machine with prod or</tspan><tspan x="570" dy="14.7">cloud credentials</tspan></text><text x="556" y="194.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="556" dy="0">•</tspan></text><text x="570" y="194.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="570" dy="0">Treat 'allow always' as a permanent grant</tspan></text><rect x="20" y="345" width="840" height="42" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="440" y="370.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Tool names differ (permission modes, sandboxes, 'yolo' or auto-approve settings), the idea is the same.</tspan></text></svg>