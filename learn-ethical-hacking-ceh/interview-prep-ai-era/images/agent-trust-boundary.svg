<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">What a coding agent reads, and what it can do</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Anything it reads can steer it; anything it can do, an attacker steering it can do</tspan></text><rect x="20" y="78" width="250" height="290" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="145" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="145" dy="0">INPUTS (some hostile)</tspan></text><text x="34" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Your prompt (trusted)</tspan></text><text x="34" y="145.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="145.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Repo files, README, comments</tspan></text><text x="34" y="167.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="167.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Issues, PRs, commit messages</tspan></text><text x="34" y="189.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="189.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Web pages and docs it fetches</tspan></text><text x="34" y="210.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="210.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">MCP server and tool output</tspan></text><text x="34" y="232.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="232.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Package READMEs and install</tspan><tspan x="48" dy="14.7">output</tspan></text><rect x="310" y="150" width="260" height="130" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="440.0" y="185.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">AI coding agent</tspan><tspan x="440.0" dy="16.9">(model + tools)</tspan><tspan x="440.0" dy="16.9"></tspan><tspan x="440.0" dy="16.9">Cannot reliably tell</tspan><tspan x="440.0" dy="16.9">data from instructions</tspan></text><line x1="272" y1="215" x2="308" y2="215" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><line x1="572" y1="215" x2="608" y2="215" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><rect x="610" y="78" width="250" height="290" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="735" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="735" dy="0">CAPABILITIES</tspan></text><text x="624" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Run shell commands</tspan></text><text x="624" y="145.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="145.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Read and write files</tspan></text><text x="624" y="167.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="167.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Install packages</tspan></text><text x="624" y="189.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="189.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Use tokens and env secrets</tspan></text><text x="624" y="210.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="210.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Network calls, git push</tspan></text><text x="624" y="232.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="624" dy="0">•</tspan></text><text x="638" y="232.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">Call other tools (MCP)</tspan></text><rect x="20" y="385" width="840" height="70" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="440" y="416.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Defence: least privilege, a sandbox, no secrets in the environment, human approval for risky actions, and</tspan><tspan x="440" dy="16.2">review of every diff.</tspan></text></svg>