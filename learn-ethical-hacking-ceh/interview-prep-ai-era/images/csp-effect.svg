<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">How a Content-Security-Policy limits an injected script</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">The second layer: it helps when output encoding has failed somewhere</tspan></text><rect x="20" y="85" width="270" height="190" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="155.0" y="184.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="155.0" dy="0"></tspan></text><text x="34" y="108" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">Server response</tspan></text><text x="34" y="126" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="34" dy="0">Content-Security-Policy:</tspan><tspan x="34" dy="14.2">  script-src 'nonce-R4nd0m'</tspan><tspan x="34" dy="14.2">  object-src 'none'</tspan><tspan x="34" dy="14.2">  frame-ancestors 'none'</tspan></text><text x="34" y="205" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.8" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="34" dy="0">&lt;script nonce="R4nd0m"&gt;app()&lt;/script&gt;</tspan><tspan x="34" dy="13.7">&lt;script&gt;steal()&lt;/script&gt;   &lt;- injected</tspan><tspan x="34" dy="13.7">&lt;img src=x onerror=steal()&gt;  &lt;- injected</tspan></text><rect x="345" y="150" width="150" height="74" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="420.0" y="175.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="420.0" dy="0">Browser checks</tspan><tspan x="420.0" dy="15.6">every script</tspan><tspan x="420.0" dy="15.6">against the policy</tspan></text><line x1="292" y1="187" x2="343" y2="187" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="560" y="85" width="280" height="54" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="700.0" y="108.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="700.0" dy="0">ALLOWED: has the right nonce (your own</tspan><tspan x="700.0" dy="15.0">app script)</tspan></text><rect x="560" y="160" width="280" height="54" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="700.0" y="191.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="700.0" dy="0">BLOCKED: inline script with no nonce</tspan></text><rect x="560" y="235" width="280" height="54" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="700.0" y="258.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="700.0" dy="0">BLOCKED: inline event handler (script-</tspan><tspan x="700.0" dy="15.0">src-attr)</tspan></text><line x1="497" y1="175" x2="558" y2="112" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><line x1="497" y1="187" x2="558" y2="187" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><line x1="497" y1="199" x2="558" y2="262" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="20" y="315" width="820" height="70" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="346.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">CSP reduces the blast radius; it does not replace encoding. Roll it out in report-only mode first, use nonces</tspan><tspan x="430" dy="15.6">with 'strict-dynamic' instead of long host allowlists, and avoid 'unsafe-inline' for scripts.</tspan></text></svg>