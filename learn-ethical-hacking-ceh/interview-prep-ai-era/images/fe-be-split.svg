<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 480" width="890" height="480"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="445.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="445.0" dy="0">Who owns what: frontend, backend and shared security work</tspan></text><text x="445.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="445.0" dy="0">Security fails in the gaps. Know your side, and the seam between the sides.</tspan></text><rect x="20" y="75" width="270" height="385" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><path d="M20,109 L20,87 Q20,75 32,75 L278,75 Q290,75 290,87 L290,109 Z" fill="#1b8a9a"/><text x="155" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="155" dy="0">FRONTEND OWNS</tspan></text><text x="34" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Safe rendering: JSX escaping, no</tspan><tspan x="48" dy="14.7">raw innerHTML</tspan></text><text x="34" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">CSP and Trusted Types rollout</tspan></text><text x="34" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Where tokens live (never plain</tspan><tspan x="48" dy="14.7">localStorage)</tspan></text><text x="34" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">No secrets in the bundle</tspan><tspan x="48" dy="14.7">(NEXT_PUBLIC_, VITE_)</tspan></text><text x="34" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Third-party scripts: fewer, with</tspan><tspan x="48" dy="14.7">SRI</tspan></text><text x="34" y="315.47999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="315.47999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Safe URLs, redirects and</tspan><tspan x="48" dy="14.7">postMessage origin checks</tspan></text><text x="34" y="353.91999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="353.91999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Security UX: passkeys, no leaky</tspan><tspan x="48" dy="14.7">error text</tspan></text><rect x="305" y="75" width="270" height="385" rx="12" fill="#eef2f5" stroke="#12304a" stroke-width="1.6"/><path d="M305,109 L305,87 Q305,75 317,75 L563,75 Q575,75 575,87 L575,109 Z" fill="#12304a"/><text x="440" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">BACKEND OWNS</tspan></text><text x="319" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Authentication and per-object</tspan><tspan x="333" dy="14.7">authorization</tspan></text><text x="319" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Schema validation of every input</tspan></text><text x="319" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Parameterized queries, least-</tspan><tspan x="333" dy="14.7">privilege database</tspan></text><text x="319" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Rate limits, body and upload</tspan><tspan x="333" dy="14.7">limits</tspan></text><text x="319" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">SSRF-safe outbound requests and</tspan><tspan x="333" dy="14.7">file handling</tspan></text><text x="319" y="315.47999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="315.47999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Secrets management; logging</tspan><tspan x="333" dy="14.7">without secrets</tspan></text><text x="319" y="353.91999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="319" dy="0">•</tspan></text><text x="333" y="353.91999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="333" dy="0">Generic errors and failing closed</tspan></text><rect x="590" y="75" width="270" height="385" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><path d="M590,109 L590,87 Q590,75 602,75 L848,75 Q860,75 860,87 L860,109 Z" fill="#2e8b57"/><text x="725" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="725" dy="0">BOTH OWN</tspan></text><text x="604" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">HTTPS, HSTS and cookie flags</tspan><tspan x="618" dy="14.7">(server sets, browser enforces)</tspan></text><text x="604" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="176.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">CORS and CSRF design</tspan></text><text x="604" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="200.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">Dependencies, lockfiles and CI/CD</tspan><tspan x="618" dy="14.7">hardening</tspan></text><text x="604" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="238.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">Threat-modelling each feature</tspan><tspan x="618" dy="14.7">together</tspan></text><text x="604" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="277.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">Reviewing AI-generated code</tspan></text><text x="604" y="300.76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="604" dy="0">•</tspan></text><text x="618" y="300.76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="618" dy="0">Incident response: rotate,</tspan><tspan x="618" dy="14.7">revoke, patch</tspan></text></svg>