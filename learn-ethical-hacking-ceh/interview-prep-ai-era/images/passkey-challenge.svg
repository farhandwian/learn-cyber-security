<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">How a passkey login works: challenge and signature</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">The device signs a one-time challenge, and only for the domain the passkey was made for</tspan></text><rect x="20" y="72" width="840" height="190" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="36" y="96" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">Real site: microsoft.com</tspan></text><rect x="36" y="112" width="185" height="128" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="46" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="46" dy="0">1  Challenge</tspan></text><text x="46" y="156" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="46" dy="0">Site sends a fresh</tspan><tspan x="46" dy="15.0">random value, e.g.</tspan><tspan x="46" dy="15.0">x7Qp9...</tspan></text><line x1="223" y1="176" x2="239" y2="176" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="241" y="112" width="185" height="128" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="251" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="251" dy="0">2  Sign</tspan></text><text x="251" y="156" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="251" dy="0">Device checks the</tspan><tspan x="251" dy="15.0">domain, then signs</tspan><tspan x="251" dy="15.0">challenge + domain with</tspan><tspan x="251" dy="15.0">the private key</tspan></text><line x1="428" y1="176" x2="444" y2="176" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="446" y="112" width="185" height="128" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="456" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="456" dy="0">3  Verify</tspan></text><text x="456" y="156" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="456" dy="0">Site checks the</tspan><tspan x="456" dy="15.0">signature with your</tspan><tspan x="456" dy="15.0">public key</tspan></text><line x1="633" y1="176" x2="649" y2="176" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="651" y="112" width="185" height="128" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="661" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="661" dy="0">4  Logged in</tspan></text><text x="661" y="156" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="661" dy="0">Only the signature</tspan><tspan x="661" dy="15.0">travelled; the private</tspan><tspan x="661" dy="15.0">key never left the</tspan><tspan x="661" dy="15.0">device</tspan></text><rect x="20" y="278" width="840" height="150" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="36" y="302" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">Look-alike site: micros0ft-login.com (AiTM proxy)</tspan></text><rect x="36" y="322" width="190" height="90" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="131.0" y="363.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="131.0" dy="0">Proxy asks your device</tspan><tspan x="131.0" dy="15.6">to sign its challenge</tspan></text><line x1="228" y1="367" x2="288" y2="367" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="290" y="322" width="270" height="90" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="425.0" y="355.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="425.0" dy="0">Device checks the domain: no</tspan><tspan x="425.0" dy="15.6">passkey is registered for</tspan><tspan x="425.0" dy="15.6">micros0ft-login.com</tspan></text><line x1="562" y1="367" x2="622" y2="367" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="624" y="322" width="220" height="90" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="734.0" y="363.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="734.0" dy="0">Refuses to sign. The proxy</tspan><tspan x="734.0" dy="15.6">has nothing to relay.</tspan></text><rect x="20" y="442" width="840" height="64" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="440" y="470.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Why it is safe: the challenge is new every time, so an old signature is useless. The browser checks the domain,</tspan><tspan x="440" dy="15.6">so a perfect copy of the page does not help the attacker.</tspan></text></svg>