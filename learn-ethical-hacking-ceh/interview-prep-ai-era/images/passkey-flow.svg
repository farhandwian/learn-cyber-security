<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Passkey (WebAuthn) login, step by step</tspan></text><rect x="98" y="48" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="170.0" y="72.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="170.0" dy="0">Browser + device</tspan></text><line x1="170" y1="88" x2="170" y2="395" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="618" y="48" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="690.0" y="72.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="690.0" dy="0">Your server</tspan></text><line x1="690" y1="88" x2="690" y2="395" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="687" y1="135" x2="173" y2="135" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="126" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">1  challenge (random) + your domain</tspan></text><rect x="20" y="160" width="340" height="66" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="190.0" y="182.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="190.0" dy="0">2  The device checks the domain, asks for</tspan><tspan x="190.0" dy="15.0">fingerprint / face / PIN, and signs the</tspan><tspan x="190.0" dy="15.0">challenge with the PRIVATE key</tspan></text><line x1="173" y1="275" x2="687" y2="275" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="266" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">3  signed response (credential id + signature)</tspan></text><rect x="430" y="295" width="410" height="62" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="635.0" y="322.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="635.0" dy="0">4  Server verifies with the stored PUBLIC key, and checks</tspan><tspan x="635.0" dy="15.0">the challenge, the origin and the signature counter</tspan></text><line x1="687" y1="385" x2="173" y2="385" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="376" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">5  session created (rotate the session id)</tspan></text><rect x="20" y="415" width="405" height="80" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="222.5" y="443.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="222.5" dy="0">A look-alike domain gets nothing usable: the key is</tspan><tspan x="222.5" dy="15.6">scoped to the real domain. That is why passkeys resist</tspan><tspan x="222.5" dy="15.6">phishing.</tspan></text><rect x="435" y="415" width="405" height="80" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="637.5" y="443.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="637.5" dy="0">Registration has the same shape, but the server stores</tspan><tspan x="637.5" dy="15.6">only the public key. Use a maintained library (for</tspan><tspan x="637.5" dy="15.6">example SimpleWebAuthn) and plan account recovery.</tspan></text></svg>