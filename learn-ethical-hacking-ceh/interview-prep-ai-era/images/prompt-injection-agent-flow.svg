<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Indirect prompt injection against a coding agent</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">The attacker never talks to the agent; they plant text where the agent will read it</tspan></text><rect x="20" y="85" width="195" height="120" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="32" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">1  Plant</tspan></text><text x="32" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Hidden instruction in an</tspan><tspan x="32" dy="15.0">issue, a README, a web</tspan><tspan x="32" dy="15.0">page or a package</tspan></text><line x1="217" y1="145" x2="233" y2="145" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="235" y="85" width="195" height="120" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="247" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="247" dy="0">2  Read</tspan></text><text x="247" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="247" dy="0">Agent opens the content</tspan><tspan x="247" dy="15.0">as part of a normal task</tspan></text><line x1="432" y1="145" x2="448" y2="145" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="450" y="85" width="195" height="120" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="462" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="462" dy="0">3  Obey</tspan></text><text x="462" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="462" dy="0">Model treats the text as</tspan><tspan x="462" dy="15.0">a command</tspan></text><line x1="647" y1="145" x2="663" y2="145" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="665" y="85" width="195" height="120" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="677" y="110" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="677" dy="0">4  Act</tspan></text><text x="677" y="134" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="677" dy="0">Agent runs a command,</tspan><tspan x="677" dy="15.0">edits a file or sends</tspan><tspan x="677" dy="15.0">data out</tspan></text><rect x="20" y="225" width="840" height="190" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="36" y="250" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">Where you break the chain</tspan></text><text x="36" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="274" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Before 'Read': treat all fetched content as untrusted; do not point agents at untrusted issues or pages with</tspan><tspan x="50" dy="15.4">write access.</tspan></text><text x="36" y="312.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="312.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Before 'Act': human approval for shell, network, and file writes outside the project; allowlist commands.</tspan></text><text x="36" y="336.08000000000004" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="336.08000000000004" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Limit the damage: no secrets in the environment, scoped short-lived tokens, a sandbox with no route to</tspan><tspan x="50" dy="15.4">production.</tspan></text><text x="36" y="374.80000000000007" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="374.80000000000007" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">After: review the diff and the commands the agent ran; CI gates catch what slips through.</tspan></text></svg>