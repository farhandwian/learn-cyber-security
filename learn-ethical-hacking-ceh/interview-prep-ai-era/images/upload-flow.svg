<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Handling file uploads safely</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Five steps, each stopping a different attack</tspan></text><rect x="20" y="75" width="152" height="46" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="96.0" y="102.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="96.0" dy="0">1  LIMIT + AUTH</tspan></text><line x1="174" y1="98" x2="185" y2="98" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="131" width="152" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="30" y="148" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">DO THIS</tspan></text><text x="30" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Require login; cap</tspan><tspan x="30" dy="14.7">file size and</tspan><tspan x="30" dy="14.7">count.</tspan></text><rect x="20" y="259" width="152" height="70" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="30" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">STOPS</tspan></text><text x="30" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Anonymous abuse,</tspan><tspan x="30" dy="14.7">disk filling</tspan></text><rect x="187" y="75" width="152" height="46" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="263.0" y="102.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="263.0" dy="0">2  CHECK CONTENT</tspan></text><line x1="341" y1="98" x2="352" y2="98" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="187" y="131" width="152" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="197" y="148" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">DO THIS</tspan></text><text x="197" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Allowlist types;</tspan><tspan x="197" dy="14.7">check the real</tspan><tspan x="197" dy="14.7">content (magic</tspan><tspan x="197" dy="14.7">bytes), not just</tspan><tspan x="197" dy="14.7">name or Content-</tspan><tspan x="197" dy="14.7">Type.</tspan></text><rect x="187" y="259" width="152" height="70" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="197" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="197" dy="0">STOPS</tspan></text><text x="197" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="197" dy="0">Disguised scripts</tspan></text><rect x="354" y="75" width="152" height="46" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="430.0" y="102.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">3  RENAME</tspan></text><line x1="508" y1="98" x2="519" y2="98" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="354" y="131" width="152" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="364" y="148" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">DO THIS</tspan></text><text x="364" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Store under a</tspan><tspan x="364" dy="14.7">random ID. Never</tspan><tspan x="364" dy="14.7">use the user's</tspan><tspan x="364" dy="14.7">filename or path.</tspan></text><rect x="354" y="259" width="152" height="70" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="364" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="364" dy="0">STOPS</tspan></text><text x="364" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="364" dy="0">Path traversal,</tspan><tspan x="364" dy="14.7">overwriting files</tspan></text><rect x="521" y="75" width="152" height="46" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="597.0" y="102.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="597.0" dy="0">4  STORE SAFELY</tspan></text><line x1="675" y1="98" x2="686" y2="98" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="521" y="131" width="152" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="531" y="148" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="531" dy="0">DO THIS</tspan></text><text x="531" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="531" dy="0">Object storage or a</tspan><tspan x="531" dy="14.7">folder outside the</tspan><tspan x="531" dy="14.7">web root, never</tspan><tspan x="531" dy="14.7">executable.</tspan></text><rect x="521" y="259" width="152" height="70" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="531" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="531" dy="0">STOPS</tspan></text><text x="531" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="531" dy="0">Direct execution</tspan></text><rect x="688" y="75" width="152" height="46" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="764.0" y="102.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="764.0" dy="0">5  SERVE SAFELY</tspan></text><rect x="688" y="131" width="152" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="698" y="148" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">DO THIS</tspan></text><text x="698" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Separate domain,</tspan><tspan x="698" dy="14.7">Content-</tspan><tspan x="698" dy="14.7">Disposition:</tspan><tspan x="698" dy="14.7">attachment,</tspan><tspan x="698" dy="14.7">nosniff.</tspan></text><rect x="688" y="259" width="152" height="70" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="698" y="276" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="698" dy="0">STOPS</tspan></text><text x="698" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="698" dy="0">Stored XSS through</tspan><tspan x="698" dy="14.7">uploads</tspan></text><rect x="20" y="345" width="820" height="56" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="369.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Treat SVG and PDF as active content (they can contain script). Process images in a sandbox. Scan files that</tspan><tspan x="430" dy="15.6">other users will download.</tspan></text></svg>