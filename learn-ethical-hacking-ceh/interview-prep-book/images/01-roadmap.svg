<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 365" width="865" height="365"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="432.5" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="432.5" dy="0">Your 4-week path</tspan></text><text x="432.5" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="432.5" dy="0">About 10 hours a week: weekday evenings plus the weekend</tspan></text><rect x="20" y="80" width="185" height="205" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,130 L20,90 Q20,80 30,80 L195,80 Q205,80 205,90 L205,130 Z" fill="#12304a"/><text x="112.5" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="112.5" dy="0">WEEK 1</tspan><tspan x="112.5" dy="18.2">Foundations</tspan></text><text x="32" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">• Security basics:</tspan><tspan x="32" dy="16.9">CIA, attack phases</tspan><tspan x="32" dy="16.9">• Cryptography and</tspan><tspan x="32" dy="16.9">TLS</tspan><tspan x="32" dy="16.9">• Networking and how</tspan><tspan x="32" dy="16.9">the web works</tspan></text><line x1="208" y1="180" x2="229" y2="180" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="232" y="80" width="185" height="205" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M232,130 L232,90 Q232,80 242,80 L407,80 Q417,80 417,90 L417,130 Z" fill="#1b8a9a"/><text x="324.5" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="324.5" dy="0">WEEK 2</tspan><tspan x="324.5" dy="18.2">Recon and scanning</tspan></text><text x="244" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="244" dy="0">• OSINT (passive</tspan><tspan x="244" dy="16.9">recon)</tspan><tspan x="244" dy="16.9">• nmap and port</tspan><tspan x="244" dy="16.9">states</tspan><tspan x="244" dy="16.9">• CVE, CWE, CVSS</tspan></text><line x1="420" y1="180" x2="441" y2="180" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="444" y="80" width="185" height="205" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M444,130 L444,90 Q444,80 454,80 L619,80 Q629,80 629,90 L629,130 Z" fill="#c0392b"/><text x="536.5" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="536.5" dy="0">WEEK 3</tspan><tspan x="536.5" dy="18.2">Web attacks</tspan></text><text x="456" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="456" dy="0">• OWASP Top 10 (2025)</tspan><tspan x="456" dy="16.9">• SQLi, XSS, CSRF</tspan><tspan x="456" dy="16.9">• IDOR, SSRF, auth</tspan><tspan x="456" dy="16.9">★ highest interview</tspan><tspan x="456" dy="16.9">value</tspan></text><line x1="632" y1="180" x2="653" y2="180" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="656" y="80" width="185" height="205" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M656,130 L656,90 Q656,80 666,80 L831,80 Q841,80 841,90 L841,130 Z" fill="#2e8b57"/><text x="748.5" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="748.5" dy="0">WEEK 4</tspan><tspan x="748.5" dy="18.2">Systems and review</tspan></text><text x="668" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="668" dy="0">• Network attacks and</tspan><tspan x="668" dy="16.9">defenses</tspan><tspan x="668" dy="16.9">• Malware, people,</tspan><tspan x="668" dy="16.9">incident response</tspan><tspan x="668" dy="16.9">• Q&amp;A drill and mock</tspan><tspan x="668" dy="16.9">interview</tspan></text><rect x="20" y="303" width="825" height="44" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="432" y="329.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="432" dy="0">Every week:  read 40%  ·  hands-on lab 40%  ·  say answers out loud 20%</tspan></text></svg>