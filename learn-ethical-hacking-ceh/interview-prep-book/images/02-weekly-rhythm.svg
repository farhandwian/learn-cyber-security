<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 300" width="870" height="300"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="435.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="435.0" dy="0">A realistic week</tspan></text><text x="435.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="435.0" dy="0">Ten hours: short weekday sessions, one longer lab block, one rest day</tspan></text><rect x="20" y="80" width="108" height="135" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="74" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="74" dy="0">MON</tspan></text><text x="74" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="74" dy="0">1.5 h</tspan></text><text x="74" y="179.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="74" dy="0">Read the</tspan><tspan x="74" dy="15.6">chapter</tspan></text><rect x="140" y="80" width="108" height="135" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="194" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="194" dy="0">TUE</tspan></text><text x="194" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="194" dy="0">1.5 h</tspan></text><text x="194" y="179.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="194" dy="0">Read, type</tspan><tspan x="194" dy="15.6">the commands</tspan></text><rect x="260" y="80" width="108" height="135" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="314" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="314" dy="0">WED</tspan></text><text x="314" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="314" dy="0">1.5 h</tspan></text><text x="314" y="179.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="314" dy="0">Mini-lab</tspan><tspan x="314" dy="15.6">(hands-on)</tspan></text><rect x="380" y="80" width="108" height="135" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="434" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="434" dy="0">THU</tspan></text><text x="434" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="434" dy="0">1.5 h</tspan></text><text x="434" y="179.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="434" dy="0">Quiz and</tspan><tspan x="434" dy="15.6">recall</tspan></text><rect x="500" y="80" width="108" height="135" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="554" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#5b6b79" font-weight="bold" text-anchor="middle"><tspan x="554" dy="0">FRI</tspan></text><text x="554" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="554" dy="0">rest</tspan></text><text x="554" y="171.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="554" dy="0">No study.</tspan><tspan x="554" dy="15.6">Sleep helps</tspan><tspan x="554" dy="15.6">memory.</tspan></text><rect x="620" y="80" width="108" height="135" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="674" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="674" dy="0">SAT</tspan></text><text x="674" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="674" dy="0">3 h</tspan></text><text x="674" y="171.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="674" dy="0">Big lab</tspan><tspan x="674" dy="15.6">(PortSwigger,</tspan><tspan x="674" dy="15.6">TryHackMe)</tspan></text><rect x="740" y="80" width="108" height="135" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="794" y="106.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="794" dy="0">SUN</tspan></text><text x="794" y="143.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="794" dy="0">1 h</tspan></text><text x="794" y="179.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="794" dy="0">Teach-back:</tspan><tspan x="794" dy="15.6">answer out loud</tspan></text><rect x="20" y="235" width="830" height="44" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="435" y="261.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="435" dy="0">Start every session with 5 minutes of recall: write what you remember from last time, no notes.</tspan></text></svg>