<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 360" width="865" height="360"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="432.5" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="432.5" dy="0">The 4-step answer for any security question</tspan></text><text x="432.5" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="432.5" dy="0">Memorize this shape; it works for almost every interview question</tspan></text><rect x="20" y="75" width="185" height="95" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,115 L20,85 Q20,75 30,75 L195,75 Q205,75 205,85 L205,115 Z" fill="#12304a"/><text x="112.5" y="99.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="112.5" dy="0">1  WHAT is it?</tspan></text><text x="32" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">One plain sentence.</tspan></text><rect x="20" y="190" width="185" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="30" y="207" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">EXAMPLE: SQL INJECTION</tspan></text><text x="30" y="225" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Untrusted input is run</tspan><tspan x="30" dy="15.4">as part of a database</tspan><tspan x="30" dy="15.4">query.</tspan></text><line x1="208" y1="122" x2="229" y2="122" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="232" y="75" width="185" height="95" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M232,115 L232,85 Q232,75 242,75 L407,75 Q417,75 417,85 L417,115 Z" fill="#12304a"/><text x="324.5" y="90.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="324.5" dy="0">2  HOW is it</tspan><tspan x="324.5" dy="18.2">exploited?</tspan></text><text x="244" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="244" dy="0">One concrete example.</tspan></text><rect x="232" y="190" width="185" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="242" y="207" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="242" dy="0">EXAMPLE: SQL INJECTION</tspan></text><text x="242" y="225" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="242" dy="0">Typing ' OR '1'='1</tspan><tspan x="242" dy="15.4">into a login form</tspan><tspan x="242" dy="15.4">makes the condition</tspan><tspan x="242" dy="15.4">always true.</tspan></text><line x1="420" y1="122" x2="441" y2="122" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="444" y="75" width="185" height="95" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M444,115 L444,85 Q444,75 454,75 L619,75 Q629,75 629,85 L629,115 Z" fill="#12304a"/><text x="536.5" y="90.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="536.5" dy="0">3  HOW do you</tspan><tspan x="536.5" dy="18.2">prevent it?</tspan></text><text x="456" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="456" dy="0">The fix in code or</tspan><tspan x="456" dy="16.9">config.</tspan></text><rect x="444" y="190" width="185" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="454" y="207" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="454" dy="0">EXAMPLE: SQL INJECTION</tspan></text><text x="454" y="225" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="454" dy="0">Parameterized queries,</tspan><tspan x="454" dy="15.4">plus a database</tspan><tspan x="454" dy="15.4">account with minimal</tspan><tspan x="454" dy="15.4">rights.</tspan></text><line x1="632" y1="122" x2="653" y2="122" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="656" y="75" width="185" height="95" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M656,115 L656,85 Q656,75 666,75 L831,75 Q841,75 841,85 L841,115 Z" fill="#12304a"/><text x="748.5" y="90.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="748.5" dy="0">4  WHEN did it</tspan><tspan x="748.5" dy="18.2">happen?</tspan></text><text x="668" y="136" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="668" dy="0">One real incident</tspan><tspan x="668" dy="16.9">(bonus).</tspan></text><rect x="656" y="190" width="185" height="120" rx="8" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="666" y="207" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9.5" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="666" dy="0">EXAMPLE: SQL INJECTION</tspan></text><text x="666" y="225" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="666" dy="0">MOVEit Transfer</tspan><tspan x="666" dy="15.4">(2023): a SQL</tspan><tspan x="666" dy="15.4">injection flaw led to</tspan><tspan x="666" dy="15.4">data theft at</tspan><tspan x="666" dy="15.4">thousands of</tspan><tspan x="666" dy="15.4">organizations.</tspan></text><text x="432" y="339.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="432" dy="0">The third step is where a software engineer stands out: always finish with the fix.</tspan></text></svg>