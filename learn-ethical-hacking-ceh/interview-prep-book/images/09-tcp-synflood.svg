<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">TCP handshake, and how a SYN flood abuses it</tspan></text><rect x="15" y="50" width="410" height="345" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="220" y="76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="220" dy="0">Normal 3-way handshake</tspan></text><rect x="435" y="50" width="410" height="345" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="640" y="76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">SYN flood (denial of service)</tspan></text><rect x="45" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="95.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">Client</tspan></text><line x1="95" y1="124" x2="95" y2="290" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="295" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="345.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="345.0" dy="0">Server</tspan></text><line x1="345" y1="124" x2="345" y2="290" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="98" y1="160" x2="342" y2="160" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">SYN  ("can we talk?")</tspan></text><line x1="342" y1="215" x2="98" y2="215" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="206" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">SYN/ACK  ("yes, can you?")</tspan></text><line x1="98" y1="270" x2="342" y2="270" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="220.0" y="261" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="220.0" dy="0">ACK  ("yes")</tspan></text><rect x="40" y="322" width="350" height="44" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="215.0" y="348.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="215.0" dy="0">Connection established: data flows</tspan></text><rect x="470" y="90" width="100" height="34" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="520.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="520.0" dy="0">Attacker</tspan></text><line x1="520" y1="124" x2="520" y2="240" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="730" y="90" width="100" height="34" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="780.0" y="111.5" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="780.0" dy="0">Server</tspan></text><line x1="780" y1="124" x2="780" y2="240" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="524" y1="150" x2="776" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="650" y="143" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650" dy="0">SYN  (fake source address)</tspan></text><line x1="524" y1="183" x2="776" y2="183" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="650" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650" dy="0">SYN</tspan></text><line x1="524" y1="216" x2="776" y2="216" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="650" y="209" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="650" dy="0">SYN</tspan></text><text x="640" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">The server answers each SYN and waits for an ACK</tspan><tspan x="640" dy="15.6">that never comes.</tspan></text><text x="455" y="313" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="455" dy="0">Waiting queue:</tspan></text><rect x="580" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="608" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="636" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="664" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="692" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="720" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="748" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><rect x="776" y="299" width="22" height="18" rx="3" fill="#c0392b" stroke="#8e1b12" stroke-width="1.6"/><text x="640" y="349.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">FULL: real users are refused (availability lost)</tspan></text><rect x="15" y="408" width="830" height="34" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="429.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses: SYN cookies  ·  rate limiting  ·  upstream DDoS protection (CDN / scrubbing)</tspan></text></svg>