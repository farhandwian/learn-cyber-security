<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 485" width="880" height="485"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">What happens when you type https://bank.com</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Interview favourite: narrate the six steps and add one security note to each</tspan></text><rect x="20" y="75" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,109 L20,85 Q20,75 30,75 L280,75 Q290,75 290,85 L290,109 Z" fill="#12304a"/><text x="155.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="155.0" dy="0">1  DNS lookup</tspan></text><text x="32" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">The browser asks a DNS server:</tspan><tspan x="32" dy="16.9">which IP address is bank.com?</tspan></text><rect x="28" y="197" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="36" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">RISK: DNS spoofing sends you to a</tspan><tspan x="36" dy="15.0">fake IP.</tspan></text><line x1="293" y1="167" x2="302" y2="167" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="305" y="75" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M305,109 L305,85 Q305,75 315,75 L565,75 Q575,75 575,85 L575,109 Z" fill="#12304a"/><text x="440.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">2  TCP handshake</tspan></text><text x="317" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="317" dy="0">SYN, SYN/ACK, ACK opens a</tspan><tspan x="317" dy="16.9">connection to port 443.</tspan></text><rect x="313" y="197" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="321" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="321" dy="0">RISK: A SYN flood can exhaust the</tspan><tspan x="321" dy="15.0">server.</tspan></text><line x1="578" y1="167" x2="587" y2="167" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="590" y="75" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M590,109 L590,85 Q590,75 600,75 L850,75 Q860,75 860,85 L860,109 Z" fill="#12304a"/><text x="725.0" y="96.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="725.0" dy="0">3  TLS handshake</tspan></text><text x="602" y="130" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="602" dy="0">The server proves its identity</tspan><tspan x="602" dy="16.9">with a certificate; both sides</tspan><tspan x="602" dy="16.9">agree on a key.</tspan></text><rect x="598" y="197" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="606" y="216" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="606" dy="0">RISK: MITM or downgrade:</tspan><tspan x="606" dy="15.0">certificates stop it.</tspan></text><rect x="20" y="280" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,314 L20,290 Q20,280 30,280 L280,280 Q290,280 290,290 L290,314 Z" fill="#12304a"/><text x="155.0" y="301.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="155.0" dy="0">4  HTTP request</tspan></text><text x="32" y="335" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">The browser sends GET /account</tspan><tspan x="32" dy="16.9">plus cookies, now encrypted.</tspan></text><rect x="28" y="402" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="36" y="421" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">RISK: Cookie theft (XSS), CSRF.</tspan></text><line x1="293" y1="372" x2="302" y2="372" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="305" y="280" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M305,314 L305,290 Q305,280 315,280 L565,280 Q575,280 575,290 L575,314 Z" fill="#12304a"/><text x="440.0" y="301.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">5  Server work</tspan></text><text x="317" y="335" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="317" dy="0">Checks login, runs business</tspan><tspan x="317" dy="16.9">logic, queries the database.</tspan></text><rect x="313" y="402" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="321" y="421" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="321" dy="0">RISK: SQL injection, IDOR, broken</tspan><tspan x="321" dy="15.0">access control.</tspan></text><line x1="578" y1="372" x2="587" y2="372" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="590" y="280" width="270" height="185" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M590,314 L590,290 Q590,280 600,280 L850,280 Q860,280 860,290 L860,314 Z" fill="#12304a"/><text x="725.0" y="301.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="725.0" dy="0">6  Response and render</tspan></text><text x="602" y="335" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="602" dy="0">HTML and JS arrive; the browser</tspan><tspan x="602" dy="16.9">enforces same-origin policy and</tspan><tspan x="602" dy="16.9">CSP.</tspan></text><rect x="598" y="402" width="254" height="54" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="606" y="421" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="normal" text-anchor="start"><tspan x="606" dy="0">RISK: XSS if output is not</tspan><tspan x="606" dy="15.0">encoded.</tspan></text><path d="M725,260 V268 H155 V277" fill="none" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/></svg>