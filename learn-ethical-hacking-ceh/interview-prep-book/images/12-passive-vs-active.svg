 stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><text x="435" y="356" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="435" dy="0">replies reveal open ports and software versions</tspan></text><text x="835" y="372" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#c0392b" font-weight="normal" text-anchor="end"><tspan x="835" dy="0">may log it or raise an alert</tspan></text></svg>