<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">The three port states nmap reports</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">nmap sends a SYN to each port and reads the reply, or the silence</tspan></text><rect x="15" y="75" width="830" height="106" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><rect x="30" y="97" width="110" height="60" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="85.0" y="123.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="85.0" dy="0">Scanner</tspan><tspan x="85.0" dy="16.2">(nmap)</tspan></text><line x1="142" y1="115" x2="330" y2="115" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="236" y="107" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="236" dy="0">SYN</tspan></text><line x1="330" y1="143" x2="142" y2="143" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#a2e8b57)"/><rect x="206.85" y="133.25" width="58.3" height="19.5" rx="4" fill="#ffffff"/><text x="236" y="147.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="236" dy="0">SYN/ACK</tspan></text><rect x="332" y="97" width="150" height="60" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="407.0" y="115.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="407.0" dy="0">Port 443</tspan><tspan x="407.0" dy="15.6">web server</tspan><tspan x="407.0" dy="15.6">listening</tspan></text><rect x="516.92" y="86.5" width="46.16" height="21" rx="10.5" fill="#2e8b57"/><text x="540" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">OPEN</tspan></text><text x="500" y="125" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="500" dy="0">A service is listening and answers.</tspan><tspan x="500" dy="15.0">This is the attack surface.</tspan></text><rect x="15" y="193" width="830" height="106" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><rect x="30" y="215" width="110" height="60" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="85.0" y="241.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="85.0" dy="0">Scanner</tspan><tspan x="85.0" dy="16.2">(nmap)</tspan></text><line x1="142" y1="233" x2="330" y2="233" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="236" y="225" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="236" dy="0">SYN</tspan></text><line x1="330" y1="261" x2="142" y2="261" stroke="#c77d0a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac77d0a)"/><rect x="193.05" y="251.25" width="85.89999999999999" height="19.5" rx="4" fill="#ffffff"/><text x="236" y="265.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="236" dy="0">RST (reset)</tspan></text><rect x="332" y="215" width="150" height="60" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="407.0" y="241.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="407.0" dy="0">Port 81</tspan><tspan x="407.0" dy="15.6">nothing listening</tspan></text><rect x="509.88" y="204.5" width="60.24" height="21" rx="10.5" fill="#c77d0a"/><text x="540" y="218.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">CLOSED</tspan></text><text x="500" y="243" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="500" dy="0">The host is reachable but no service uses this</tspan><tspan x="500" dy="15.0">port.</tspan><tspan x="500" dy="15.0">Useful: proves the host is alive.</tspan></text><rect x="15" y="311" width="830" height="106" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><rect x="30" y="333" width="110" height="60" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="85.0" y="359.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="85.0" dy="0">Scanner</tspan><tspan x="85.0" dy="16.2">(nmap)</tspan></text><line x1="142" y1="351" x2="283" y2="351" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="212" y="343" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="212" dy="0">SYN</tspan></text><rect x="286" y="323" width="12" height="82" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="292" y="415" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#c0392b" font-weight="normal" text-anchor="middle"><tspan x="292" dy="0">firewall</tspan></text><rect x="158.25" y="371.25" width="113.5" height="19.5" rx="4" fill="#ffffff"/><text x="215" y="385.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="215" dy="0">no reply at all</tspan></text><rect x="332" y="333" width="150" height="60" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="407.0" y="359.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="407.0" dy="0">Port 23</tspan><tspan x="407.0" dy="15.6">behind a firewall</tspan></text><rect x="502.84000000000003" y="322.5" width="74.32" height="21" rx="10.5" fill="#c0392b"/><text x="540" y="336.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">FILTERED</tspan></text><text x="500" y="361" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="500" dy="0">A firewall silently drops the probe.</tspan><tspan x="500" dy="15.0">nmap cannot tell open from closed.</tspan></text></svg>