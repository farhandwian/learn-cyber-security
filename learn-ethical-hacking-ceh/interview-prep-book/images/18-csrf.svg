<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">CSRF: the browser sends your cookie, even when you did not mean to</tspan></text><rect x="58" y="55" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="130.0" y="79.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="130.0" dy="0">Victim's browser</tspan></text><line x1="130" y1="95" x2="130" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="358" y="55" width="144" height="40" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="79.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Malicious page</tspan></text><line x1="430" y1="95" x2="430" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="658" y="55" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="730.0" y="79.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">Bank</tspan></text><line x1="730" y1="95" x2="730" y2="435" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="112" width="330" height="44" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="185.0" y="130.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="185.0" dy="0">0  Victim is already logged in to the bank</tspan><tspan x="185.0" dy="15.6">(cookie stored)</tspan></text><line x1="133" y1="195" x2="427" y2="195" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="280.0" y="186" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">1  visits a malicious page</tspan></text><line x1="427" y1="245" x2="133" y2="245" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="280.0" y="236" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">2  page holds a hidden request to bank.com</tspan></text><line x1="133" y1="305" x2="727" y2="305" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="430.0" y="296" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">3  browser sends it AND attaches the bank cookie automatically</tspan></text><rect x="520" y="325" width="330" height="50" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="685.0" y="346.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="685.0" dy="0">4  Bank sees a valid session and performs</tspan><tspan x="685.0" dy="15.6">the action.</tspan></text><rect x="234.20000000000002" y="395.0" width="391.59999999999997" height="20" rx="4" fill="#ffffff"/><text x="430" y="409.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430" dy="0">The victim never clicked anything on the bank's site.</tspan></text><rect x="15" y="452" width="830" height="62" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="487.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses:  anti-CSRF token  ·  SameSite cookies  ·  re-authenticate for sensitive actions</tspan></text></svg>