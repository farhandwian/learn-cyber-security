<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">IDOR: logged in does not mean allowed</tspan></text><rect x="15" y="45" width="830" height="190" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><rect x="65.8" y="51.5" width="88.4" height="21" rx="10.5" fill="#c0392b"/><text x="110" y="65.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="110" dy="0">VULNERABLE</tspan></text><rect x="30" y="90" width="130" height="64" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="95.0" y="118.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">Alice</tspan><tspan x="95.0" dy="16.9">(user 1001)</tspan></text><line x1="162" y1="112" x2="328" y2="112" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="245" y="103" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="245" dy="0">GET /orders/1002</tspan></text><text x="245" y="133" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="245" dy="0">(she edited the number)</tspan></text><rect x="330" y="86" width="200" height="76" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="112.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Server asks only:</tspan><tspan x="430.0" dy="15.6">"is the user logged in?"</tspan><tspan x="430.0" dy="15.6">YES</tspan></text><line x1="532" y1="124" x2="628" y2="124" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="630" y="90" width="200" height="68" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="730.0" y="120.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">Returns Bob's order</tspan><tspan x="730.0" dy="16.2">(private data leaked)</tspan></text><text x="30" y="205" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Authentication passed, but authorization was never checked.</tspan></text><rect x="15" y="250" width="830" height="180" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><rect x="63.4" y="256.5" width="53.2" height="21" rx="10.5" fill="#2e8b57"/><text x="90" y="270.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="90" dy="0">FIXED</tspan></text><rect x="30" y="295" width="130" height="64" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="95.0" y="323.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">Alice</tspan><tspan x="95.0" dy="16.9">(user 1001)</tspan></text><line x1="162" y1="317" x2="328" y2="317" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="245" y="308" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="245" dy="0">GET /orders/1002</tspan></text><rect x="330" y="288" width="200" height="78" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="430.0" y="315.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Server also asks:</tspan><tspan x="430.0" dy="15.6">"does order 1002 belong</tspan><tspan x="430.0" dy="15.6">to Alice?"  NO</tspan></text><line x1="532" y1="327" x2="628" y2="327" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><rect x="630" y="295" width="200" height="64" rx="10" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.6"/><text x="730.0" y="331.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">403 Forbidden</tspan></text><text x="30" y="400" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Check ownership on the server for every object and every request. Hard-to-guess IDs are not a fix.</tspan></text></svg>