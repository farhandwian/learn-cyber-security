<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 435" width="880" height="435"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Defense in depth: who sits where</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Each layer catches what the previous one cannot</tspan></text><rect x="20" y="90" width="150" height="60" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="95.0" y="124.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">Internet</tspan></text><text x="95" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="95" dy="0">Anyone, including</tspan><tspan x="95" dy="14.3">attackers.</tspan></text><rect x="190" y="90" width="150" height="60" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="265.0" y="124.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="265.0" dy="0">Firewall</tspan></text><text x="265" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="265" dy="0">Allows or blocks by IP</tspan><tspan x="265" dy="14.3">address and port.</tspan><tspan x="265" dy="14.3">Cannot read HTTP</tspan><tspan x="265" dy="14.3">content.</tspan></text><rect x="360" y="90" width="150" height="60" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="435.0" y="124.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="435.0" dy="0">IPS</tspan></text><text x="435" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="435" dy="0">Sits in the path.</tspan><tspan x="435" dy="14.3">Detects attacks AND</tspan><tspan x="435" dy="14.3">blocks them.</tspan></text><rect x="530" y="90" width="150" height="60" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="605.0" y="124.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="605.0" dy="0">WAF</tspan></text><text x="605" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="605" dy="0">Understands HTTP.</tspan><tspan x="605" dy="14.3">Blocks SQLi and XSS</tspan><tspan x="605" dy="14.3">patterns.</tspan></text><rect x="700" y="90" width="150" height="60" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="775.0" y="124.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="775.0" dy="0">Web server</tspan></text><text x="775" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="775" dy="0"></tspan></text><line x1="171" y1="120" x2="189" y2="120" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><line x1="341" y1="120" x2="359" y2="120" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><line x1="511" y1="120" x2="529" y2="120" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><line x1="681" y1="120" x2="699" y2="120" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="765" y="172" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="end"><tspan x="765" dy="0">Your code.</tspan><tspan x="765" dy="14.3">It must be</tspan><tspan x="765" dy="14.3">secure too!</tspan></text><line x1="350" y1="120" x2="350" y2="262" stroke="#c77d0a" stroke-width="2" stroke-dasharray="6 4"/><rect x="275" y="262" width="150" height="56" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="350.0" y="294.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="350.0" dy="0">IDS</tspan></text><text x="350" y="338" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="350" dy="0">Watches a COPY of the traffic.</tspan><tspan x="350" dy="14.3">Alerts only; does not block.</tspan></text><rect x="40" y="262" width="150" height="56" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="115.0" y="286.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="115.0" dy="0">Security team</tspan><tspan x="115.0" dy="15.6">(gets the alert)</tspan></text><line x1="273" y1="290" x2="192" y2="290" stroke="#c77d0a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac77d0a)"/><line x1="775" y1="152" x2="775" y2="262" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><rect x="700" y="262" width="150" height="56" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="775.0" y="278.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="775.0" dy="0">Database</tspan><tspan x="775.0" dy="15.6">(private network</tspan><tspan x="775.0" dy="15.6">only)</tspan></text><rect x="15" y="378" width="850" height="42" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="440" y="403.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Layers overlap on purpose: if one fails, the next still protects you. That is defense in depth.</tspan></text></svg>