x="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="760.0" y="154.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="760.0" dy="0">Server</tspan></text><line x1="167" y1="138" x2="363" y2="138" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><line x1="497" y1="138" x2="693" y2="138" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><line x1="363" y1="166" x2="167" y2="166" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><line x1="693" y1="166" x2="497" y2="166" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ac0392b)"/><text x="265" y="128" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#c0392b" font-weight="normal" text-anchor="middle"><tspan x="265" dy="0">password=hunter2</tspan></text><text x="595" y="128" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#c0392b" font-weight="normal" text-anchor="middle"><tspan x="595" dy="0">password=hunter2</tspan></text><text x="430" y="214" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">The attacker reads and can change everything, in plain text.</tspan></text><rect x="15" y="250" width="830" height="165" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><rect x="57.84" y="257.5" width="74.32" height="21" rx="10.5" fill="#2e8b57"/><text x="95" y="271.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95" dy="0">WITH TLS</tspan></text><rect x="35" y="300" width="130" height="60" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="100.0" y="334.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="100.0" dy="0">Victim</tspan></text><rect x="365" y="300" width="130" height="60" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="430.0" y="334.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Attacker</tspan></text><rect x="695" y="300" width="130" height="60" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="760.0" y="334.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="760.0" dy="0">Server</tspan></text><line x1="167" y1="330" x2="363" y2="330" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)" marker-start="url(#a2e8b57)"/><line x1="497" y1="330" x2="693" y2="330" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)" marker-start="url(#a2e8b57)"/><text x="265" y="320" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#2e8b57" font-weight="normal" text-anchor="middle"><tspan x="265" dy="0">x9f#a1…</tspan></text><text x="595" y="320" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#2e8b57" font-weight="normal" text-anchor="middle"><tspan x="595" dy="0">x9f#a1…</tspan></text><text x="430" y="385" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">The attacker sees only scrambled bytes. A fake certificate makes the browser show a warning.</tspan></text></svg>