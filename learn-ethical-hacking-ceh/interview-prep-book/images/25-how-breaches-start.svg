<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 485" width="860" height="485"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">How breaches started in the 2026 Verizon report</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Share of breaches by initial access vector: latest report vs previous report</tspan></text><text x="20" y="102" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Exploited a vulnerability</tspan></text><rect x="240" y="84" width="294.5" height="26" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="542.5" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="542.5" dy="0">31%</tspan></text><rect x="240" y="116" width="190.0" height="16" rx="4" fill="#c9d2d9" stroke="#c9d2d9" stroke-width="1.6"/><text x="438.0" y="129" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="438.0" dy="0">20% in previous report</tspan></text><text x="20" y="180" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Abused stolen credentials</tspan></text><rect x="240" y="162" width="123.5" height="26" rx="4" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="371.5" y="182" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="371.5" dy="0">13%</tspan></text><rect x="240" y="194" width="209.0" height="16" rx="4" fill="#c9d2d9" stroke="#c9d2d9" stroke-width="1.6"/><text x="457.0" y="207" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="457.0" dy="0">22% in previous report</tspan></text><text x="20" y="258" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Pretexting (social</tspan><tspan x="20" dy="16.9">engineering)</tspan></text><rect x="240" y="240" width="57.0" height="26" rx="4" fill="#c77d0a" stroke="#c77d0a" stroke-width="1.6"/><text x="305.0" y="260" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="305.0" dy="0">6%</tspan></text><rect x="240" y="272" width="57.0" height="16" rx="4" fill="#c9d2d9" stroke="#c9d2d9" stroke-width="1.6"/><text x="305.0" y="285" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="305.0" dy="0">6% in previous report</tspan></text><rect x="20" y="330" width="195" height="104" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="34" y="366" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="25" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">48%</tspan></text><text x="34" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="34" dy="0">of breaches involved a</tspan><tspan x="34" dy="15.0">third party (was 30%)</tspan></text><rect x="227" y="330" width="195" height="104" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="241" y="366" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="25" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="241" dy="0">48%</tspan></text><text x="241" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="241" dy="0">of breaches involved</tspan><tspan x="241" dy="15.0">ransomware (was 44%)</tspan></text><rect x="434" y="330" width="195" height="104" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="448" y="366" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="25" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="448" dy="0">43 days</tspan></text><text x="448" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="448" dy="0">median time to fully</tspan><tspan x="448" dy="15.0">patch known-exploited</tspan><tspan x="448" dy="15.0">flaws (was 32)</tspan></text><rect x="641" y="330" width="195" height="104" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><text x="655" y="366" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="25" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="655" dy="0">26%</tspan></text><text x="655" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="655" dy="0">of known-exploited flaws</tspan><tspan x="655" dy="15.0">were fully fixed (was</tspan><tspan x="655" dy="15.0">38%)</tspan></text><text x="20" y="460" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">Source: Verizon DBIR 2026 as reported by TechTarget and Help Net Security; breaches from about Nov 2024 to Oct 2025. Phishing's</tspan><tspan x="20" dy="13.7">own share was not stated in those articles.</tspan></text></svg>