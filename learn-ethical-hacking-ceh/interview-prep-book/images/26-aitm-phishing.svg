<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Adversary-in-the-middle phishing: how MFA gets bypassed</tspan></text><rect x="58" y="48" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="130.0" y="72.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="130.0" dy="0">Victim</tspan></text><line x1="130" y1="88" x2="130" y2="420" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="358" y="48" width="144" height="40" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="72.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Look-alike site</tspan></text><line x1="430" y1="88" x2="430" y2="420" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="658" y="48" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="730.0" y="72.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">Real site</tspan></text><line x1="730" y1="88" x2="730" y2="420" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="133" y1="135" x2="427" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="280.0" y="126" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">1  types password on look-alike site</tspan></text><line x1="433" y1="175" x2="727" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="580.0" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">2  relays the password</tspan></text><line x1="727" y1="215" x2="433" y2="215" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="580.0" y="206" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">3  asks for the MFA code</tspan></text><line x1="133" y1="255" x2="427" y2="255" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="280.0" y="246" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">4  victim enters the MFA code</tspan></text><line x1="433" y1="295" x2="727" y2="295" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="580.0" y="286" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">5  relays the code: login succeeds</tspan></text><line x1="727" y1="335" x2="433" y2="335" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="580.0" y="326" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">6  sends the session cookie</tspan></text><rect x="470" y="358" width="375" height="56" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="657.5" y="374.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="657.5" dy="0">7  The proxy keeps the cookie. The attacker is now</tspan><tspan x="657.5" dy="15.6">logged in as the victim. MFA was relayed, not</tspan><tspan x="657.5" dy="15.6">broken.</tspan></text><rect x="15" y="358" width="385" height="56" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="207.5" y="374.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="207.5" dy="0">A passkey refuses step 1: it only works for the</tspan><tspan x="207.5" dy="15.6">real domain, so the look-alike gets nothing to</tspan><tspan x="207.5" dy="15.6">relay.</tspan></text><rect x="15" y="445" width="830" height="64" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="473.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses:  passkeys / FIDO2 keys  ·  short sessions and token binding  ·  risk-based conditional access  ·</tspan><tspan x="430" dy="15.6">revoke all sessions after a suspected phish</tspan></text></svg>