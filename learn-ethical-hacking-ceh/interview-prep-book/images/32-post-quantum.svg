<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Harvest now, decrypt later: why post-quantum crypto matters</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">The risk is to data that must stay secret for many years</tspan></text><rect x="20" y="72" width="250" height="124" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,106 L20,82 Q20,72 30,72 L260,72 Q270,72 270,82 L270,106 Z" fill="#12304a"/><text x="145.0" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="145.0" dy="0">1  TODAY</tspan></text><text x="32" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">An attacker records your</tspan><tspan x="32" dy="16.9">encrypted traffic. They cannot</tspan><tspan x="32" dy="16.9">read it yet.</tspan></text><line x1="273" y1="134" x2="299" y2="134" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="302" y="72" width="250" height="124" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><path d="M302,106 L302,82 Q302,72 312,72 L542,72 Q552,72 552,82 L552,106 Z" fill="#c77d0a"/><text x="427.0" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="427.0" dy="0">2  STORE</tspan></text><text x="314" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="314" dy="0">Storage is cheap, so</tspan><tspan x="314" dy="16.9">recordings are kept for years.</tspan></text><line x1="555" y1="134" x2="581" y2="134" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="584" y="72" width="250" height="124" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M584,106 L584,82 Q584,72 594,72 L824,72 Q834,72 834,82 L834,106 Z" fill="#c0392b"/><text x="709.0" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="709.0" dy="0">3  LATER</tspan></text><text x="596" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="596" dy="0">A large quantum computer</tspan><tspan x="596" dy="16.9">breaks RSA/ECC key exchange,</tspan><tspan x="596" dy="16.9">and the old traffic becomes</tspan><tspan x="596" dy="16.9">readable.</tspan></text><rect x="20" y="210" width="820" height="40" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="226.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Who should worry first: data that must stay secret for 10+ years (health, legal, government, long-lived</tspan><tspan x="430" dy="16.2">IP).</tspan></text><line x1="40" y1="340" x2="820" y2="340" stroke="#12304a" stroke-width="3"/><circle cx="70" cy="340" r="7" fill="#2e8b57" stroke="#ffffff" stroke-width="2"/><text x="20" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Aug 2024</tspan></text><text x="20" y="306" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">NIST publishes FIPS 203, 204, 205</tspan><tspan x="20" dy="13.8">(ML-KEM, ML-DSA, SLH-DSA)</tspan></text><circle cx="216" cy="340" r="7" fill="#2e8b57" stroke="#ffffff" stroke-width="2"/><text x="216" y="372" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="216" dy="0">Oct 2026</tspan></text><text x="216" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="216" dy="0">NIST IR 8547 final:</tspan><tspan x="216" dy="13.8">the transition plan</tspan></text><circle cx="429" cy="340" r="7" fill="#2e8b57" stroke="#ffffff" stroke-width="2"/><text x="429" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="429" dy="0">After 2030</tspan></text><text x="429" y="306" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="429" dy="0">RSA and ECC</tspan><tspan x="429" dy="13.8">deprecated</tspan></text><circle cx="761" cy="340" r="7" fill="#2e8b57" stroke="#ffffff" stroke-width="2"/><text x="840" y="372" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="end"><tspan x="840" dy="0">After 2035</tspan></text><text x="840" y="388" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="end"><tspan x="840" dy="0">disallowed in NIST</tspan><tspan x="840" dy="13.8">standards and guidelines</tspan></text><rect x="20" y="425" width="820" height="40" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="441.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">What you do now: inventory where RSA/ECC is used, prefer TLS 1.3, stay crypto-agile, and plan for hybrid post-</tspan><tspan x="430" dy="15.6">quantum key exchange.</tspan></text></svg>