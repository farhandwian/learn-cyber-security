<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 495" width="860" height="495"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">How to store passwords (and how not to)</tspan></text><rect x="15" y="50" width="830" height="116" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><rect x="28" y="68" width="190" height="80" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="123.0" y="112.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="123.0" dy="0">1  Plaintext</tspan></text><text x="240" y="80" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="240" dy="0">user</tspan></text><text x="320" y="80" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="320" dy="0">stored in the database</tspan></text><text x="240" y="105" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">alice</tspan></text><text x="320" y="105" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">password123</tspan></text><text x="240" y="130" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">bob</tspan></text><text x="320" y="130" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">password123</tspan></text><text x="560" y="78" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">both chose the same password</tspan></text><text x="560" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">A leak is instant disaster. Anyone</tspan><tspan x="560" dy="15.6">with database access reads every</tspan><tspan x="560" dy="15.6">password.</tspan></text><rect x="15" y="178" width="830" height="116" rx="10" fill="#fdf3e0" stroke="#d9622b" stroke-width="1.6"/><rect x="28" y="196" width="190" height="80" rx="10" fill="#d9622b" stroke="#d9622b" stroke-width="1.6"/><text x="123.0" y="232.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="123.0" dy="0">2  Fast hash, no salt</tspan><tspan x="123.0" dy="16.2">(MD5, SHA-1)</tspan></text><text x="240" y="208" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="240" dy="0">user</tspan></text><text x="320" y="208" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="320" dy="0">stored in the database</tspan></text><text x="240" y="233" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">alice</tspan></text><text x="320" y="233" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">482c811da5d5b4bc6d49…</tspan></text><text x="240" y="258" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">bob</tspan></text><text x="320" y="258" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">482c811da5d5b4bc6d49…</tspan></text><text x="560" y="206" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">both chose "password123"</tspan></text><text x="560" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9622b" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">Same password gives the same hash.</tspan><tspan x="560" dy="15.6">Rainbow tables and GPUs crack</tspan><tspan x="560" dy="15.6">billions per second.</tspan></text><rect x="15" y="306" width="830" height="116" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><rect x="28" y="324" width="190" height="80" rx="10" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.6"/><text x="123.0" y="352.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="123.0" dy="0">3  Salted slow hash</tspan><tspan x="123.0" dy="16.2">(bcrypt, scrypt,</tspan><tspan x="123.0" dy="16.2">Argon2)</tspan></text><text x="240" y="336" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="240" dy="0">user</tspan></text><text x="320" y="336" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="320" dy="0">stored in the database</tspan></text><text x="240" y="361" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">alice</tspan></text><text x="320" y="361" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">$2b$12$Qk7Lm…9aXe</tspan></text><text x="240" y="386" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="240" dy="0">bob</tspan></text><text x="320" y="386" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="320" dy="0">$2b$12$Zp1Rt…m4Tu</tspan></text><text x="560" y="334" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">both chose "password123"</tspan></text><text x="560" y="356" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="560" dy="0">Different hash for the same password,</tspan><tspan x="560" dy="15.6">and every guess is deliberately</tspan><tspan x="560" dy="15.6">expensive.</tspan></text><text x="20" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">Why it matters today: leaked passwords are reused on other sites (credential stuffing). Passkeys remove the password</tspan><tspan x="20" dy="15.0">entirely; where passwords remain, a slow salted hash limits the damage.</tspan></text><text x="20" y="480" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="20" dy="0">Rule: never encrypt passwords (keys get stolen) and never use a fast hash. Use a slow, salted password hash.</tspan></text></svg>