<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Prompt injection: when the data tells the AI what to do</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">An AI agent reads text an attacker wrote, then uses its tools with your permissions</tspan></text><rect x="20" y="85" width="150" height="56" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="95.0" y="109.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="95.0" dy="0">You</tspan><tspan x="95.0" dy="16.9">(the user)</tspan></text><rect x="20" y="185" width="190" height="84" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="115.0" y="215.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="115.0" dy="0">Untrusted content:</tspan><tspan x="115.0" dy="15.6">email, web page, PDF,</tspan><tspan x="115.0" dy="15.6">support ticket</tspan></text><rect x="300" y="80" width="270" height="195" rx="12" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="435" y="102" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#1b8a9a" font-weight="bold" text-anchor="middle"><tspan x="435" dy="0">AI agent (LLM + tools)</tspan></text><text x="316" y="128" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="316" dy="0">Everything goes into ONE prompt:</tspan><tspan x="316" dy="15.6">• your request</tspan><tspan x="316" dy="15.6">• the system rules</tspan><tspan x="316" dy="15.6">• the attacker's text</tspan></text><text x="316" y="212" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="316" dy="0">3  The model cannot reliably tell</tspan><tspan x="316" dy="15.6">instructions from data.</tspan></text><rect x="660" y="100" width="180" height="140" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="750.0" y="143.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="750.0" dy="0">Tools it can use:</tspan><tspan x="750.0" dy="15.6">send email</tspan><tspan x="750.0" dy="15.6">read files</tspan><tspan x="750.0" dy="15.6">call APIs</tspan><tspan x="750.0" dy="15.6">browse the web</tspan></text><line x1="172" y1="113" x2="298" y2="113" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><rect x="222.48" y="89.5" width="25.04" height="21" rx="10.5" fill="#12304a"/><text x="235" y="103.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="235" dy="0">1</tspan></text><line x1="212" y1="235" x2="298" y2="235" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="242.48" y="211.5" width="25.04" height="21" rx="10.5" fill="#c0392b"/><text x="255" y="225.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="255" dy="0">2</tspan></text><line x1="572" y1="170" x2="658" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="602.48" y="146.5" width="25.04" height="21" rx="10.5" fill="#c0392b"/><text x="615" y="160.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="615" dy="0">4</tspan></text><text x="20" y="300" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">1  You ask a normal question, such as "summarize my inbox".</tspan><tspan x="20" dy="16.1">2  The agent reads content that hides instructions for it.</tspan><tspan x="20" dy="16.1">3  The model follows the hidden instructions as if they were yours.</tspan><tspan x="20" dy="16.1">4  The agent uses a tool with YOUR permissions, for example to send data out.</tspan></text><rect x="15" y="380" width="830" height="44" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="406.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">The risky combination: private data  +  untrusted content  +  a way to send data out. Remove at least one.</tspan></text><rect x="15" y="436" width="830" height="50" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430" y="457.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Defenses: least-privilege tools · human approval for risky actions · treat model output as untrusted · no</tspan><tspan x="430" dy="15.6">secrets in prompts · log tool use</tspan></text></svg>