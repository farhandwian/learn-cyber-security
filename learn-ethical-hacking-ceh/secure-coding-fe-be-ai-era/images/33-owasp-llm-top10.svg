<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 522" width="905" height="522"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="452.5" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="452.5" dy="0">OWASP Top 10 for LLM Applications (2025) at a glance</tspan></text><text x="452.5" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="452.5" dy="0">Prompt injection is #1. Many of the rest are old web ideas in a new place.</tspan></text><rect x="20" y="72" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M20,140 L20,82 Q20,72 30,72 L175,72 Q185,72 185,82 L185,140 Z" fill="#6b4fa0"/><text x="30" y="89" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">LLM01</tspan></text><text x="30" y="106" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Prompt Injection</tspan></text><text x="30" y="162" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Crafted input, direct</tspan><tspan x="30" dy="13.4">or hidden in content</tspan><tspan x="30" dy="13.4">the model reads,</tspan><tspan x="30" dy="13.4">changes its behaviour.</tspan></text><rect x="26" y="214" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="32" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">FIX: Least privilege</tspan><tspan x="32" dy="12.2">plus human approval for</tspan><tspan x="32" dy="12.2">risky actions.</tspan></text><rect x="195" y="72" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M195,140 L195,82 Q195,72 205,72 L350,72 Q360,72 360,82 L360,140 Z" fill="#6b4fa0"/><text x="205" y="89" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">LLM02</tspan></text><text x="205" y="106" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">Sensitive</tspan><tspan x="205" dy="13.8">Information</tspan><tspan x="205" dy="13.8">Disclosure</tspan></text><text x="205" y="162" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="205" dy="0">The model or app leaks</tspan><tspan x="205" dy="13.4">private data, secrets</tspan><tspan x="205" dy="13.4">or personal</tspan><tspan x="205" dy="13.4">information.</tspan></text><rect x="201" y="214" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="207" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="207" dy="0">FIX: Keep secrets out</tspan><tspan x="207" dy="12.2">of prompts; per-user</tspan><tspan x="207" dy="12.2">access control.</tspan></text><rect x="370" y="72" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M370,140 L370,82 Q370,72 380,72 L525,72 Q535,72 535,82 L535,140 Z" fill="#6b4fa0"/><text x="380" y="89" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">LLM03</tspan></text><text x="380" y="106" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">Supply Chain</tspan></text><text x="380" y="162" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="380" dy="0">Poisoned models,</tspan><tspan x="380" dy="13.4">datasets, plugins or</tspan><tspan x="380" dy="13.4">dependencies.</tspan></text><rect x="376" y="214" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="382" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="382" dy="0">FIX: Trusted sources;</tspan><tspan x="382" dy="12.2">pin, scan and verify.</tspan></text><rect x="545" y="72" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M545,140 L545,82 Q545,72 555,72 L700,72 Q710,72 710,82 L710,140 Z" fill="#6b4fa0"/><text x="555" y="89" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">LLM04</tspan></text><text x="555" y="106" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">Data and Model</tspan><tspan x="555" dy="13.8">Poisoning</tspan></text><text x="555" y="162" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="555" dy="0">Tampered training,</tspan><tspan x="555" dy="13.4">fine-tuning or</tspan><tspan x="555" dy="13.4">embedding data.</tspan></text><rect x="551" y="214" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="557" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="557" dy="0">FIX: Vet data sources;</tspan><tspan x="557" dy="12.2">monitor and test.</tspan></text><rect x="720" y="72" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M720,140 L720,82 Q720,72 730,72 L875,72 Q885,72 885,82 L885,140 Z" fill="#6b4fa0"/><text x="730" y="89" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">LLM05</tspan></text><text x="730" y="106" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">Improper Output</tspan><tspan x="730" dy="13.8">Handling</tspan></text><text x="730" y="162" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="730" dy="0">The app trusts model</tspan><tspan x="730" dy="13.4">output (XSS, SQL, code</tspan><tspan x="730" dy="13.4">execution).</tspan></text><rect x="726" y="214" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="732" y="228" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="732" dy="0">FIX: Treat output like</tspan><tspan x="732" dy="12.2">user input: validate</tspan><tspan x="732" dy="12.2">and encode.</tspan></text><rect x="20" y="277" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M20,345 L20,287 Q20,277 30,277 L175,277 Q185,277 185,287 L185,345 Z" fill="#6b4fa0"/><text x="30" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">LLM06</tspan></text><text x="30" y="311" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Excessive Agency</tspan></text><text x="30" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">The AI has more tools,</tspan><tspan x="30" dy="13.4">rights or autonomy than</tspan><tspan x="30" dy="13.4">it needs.</tspan></text><rect x="26" y="419" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="32" y="433" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">FIX: Minimal tools and</tspan><tspan x="32" dy="12.2">permissions; human</tspan><tspan x="32" dy="12.2">approval.</tspan></text><rect x="195" y="277" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M195,345 L195,287 Q195,277 205,277 L350,277 Q360,277 360,287 L360,345 Z" fill="#6b4fa0"/><text x="205" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">LLM07</tspan></text><text x="205" y="311" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">System Prompt</tspan><tspan x="205" dy="13.8">Leakage</tspan></text><text x="205" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="205" dy="0">Secrets or rules in the</tspan><tspan x="205" dy="13.4">system prompt get</tspan><tspan x="205" dy="13.4">exposed.</tspan></text><rect x="201" y="419" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="207" y="433" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="207" dy="0">FIX: Never rely on a</tspan><tspan x="207" dy="12.2">prompt for secrets or</tspan><tspan x="207" dy="12.2">security.</tspan></text><rect x="370" y="277" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M370,345 L370,287 Q370,277 380,277 L525,277 Q535,277 535,287 L535,345 Z" fill="#6b4fa0"/><text x="380" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">LLM08</tspan></text><text x="380" y="311" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">Vector and</tspan><tspan x="380" dy="13.8">Embedding</tspan><tspan x="380" dy="13.8">Weaknesses</tspan></text><text x="380" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="380" dy="0">Flaws in RAG stores:</tspan><tspan x="380" dy="13.4">leaks, poisoning, no</tspan><tspan x="380" dy="13.4">access control.</tspan></text><rect x="376" y="419" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="382" y="433" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="382" dy="0">FIX: Per-user access</tspan><tspan x="382" dy="12.2">control on retrieval.</tspan></text><rect x="545" y="277" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M545,345 L545,287 Q545,277 555,277 L700,277 Q710,277 710,287 L710,345 Z" fill="#6b4fa0"/><text x="555" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">LLM09</tspan></text><text x="555" y="311" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">Misinformation</tspan></text><text x="555" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="555" dy="0">Confident wrong answers</tspan><tspan x="555" dy="13.4">cause real harm.</tspan></text><rect x="551" y="419" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="557" y="433" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="557" dy="0">FIX: Ground answers in</tspan><tspan x="557" dy="12.2">sources; verify; show</tspan><tspan x="557" dy="12.2">citations.</tspan></text><rect x="720" y="277" width="165" height="195" rx="10" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.6"/><path d="M720,345 L720,287 Q720,277 730,277 L875,277 Q885,277 885,287 L885,345 Z" fill="#6b4fa0"/><text x="730" y="294" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#d9cdf0" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">LLM10</tspan></text><text x="730" y="311" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">Unbounded</tspan><tspan x="730" dy="13.8">Consumption</tspan></text><text x="730" y="367" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="730" dy="0">Unlimited use drives</tspan><tspan x="730" dy="13.4">cost or denial of</tspan><tspan x="730" dy="13.4">service.</tspan></text><rect x="726" y="419" width="153" height="47" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="732" y="433" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="732" dy="0">FIX: Rate limits,</tspan><tspan x="732" dy="12.2">quotas and budgets.</tspan></text><text x="20" y="494" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">Source: genai.owasp.org. The separate OWASP Top 10 for Agentic Applications (Dec 2025) covers goal hijack, tool misuse, identity abuse</tspan><tspan x="20" dy="13.7">and more.</tspan></text></svg>