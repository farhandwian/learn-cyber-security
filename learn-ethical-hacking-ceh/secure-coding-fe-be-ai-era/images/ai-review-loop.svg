<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">The review loop when an agent writes the code</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">The agent is fast; the safety comes from what you check after</tspan></text><rect x="20" y="90" width="155" height="150" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="30" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Prompt</tspan></text><text x="30" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">State the</tspan><tspan x="30" dy="14.3">constraints: authz,</tspan><tspan x="30" dy="14.3">validation, no new</tspan><tspan x="30" dy="14.3">deps</tspan></text><line x1="176" y1="165" x2="189" y2="165" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="190" y="90" width="155" height="150" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="200" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="200" dy="0">Agent writes</tspan></text><text x="200" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="200" dy="0">Diff + tests</tspan></text><line x1="346" y1="165" x2="359" y2="165" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="360" y="90" width="155" height="150" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="370" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="370" dy="0">You review</tspan></text><text x="370" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="370" dy="0">5 questions: who,</tspan><tspan x="370" dy="14.3">allowed, controlled,</tspan><tspan x="370" dy="14.3">destination, failure</tspan></text><line x1="516" y1="165" x2="529" y2="165" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="530" y="90" width="155" height="150" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="540" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="540" dy="0">Automated gates</tspan></text><text x="540" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="540" dy="0">Tests, SAST, secret</tspan><tspan x="540" dy="14.3">scan, dependency</tspan><tspan x="540" dy="14.3">check</tspan></text><line x1="686" y1="165" x2="699" y2="165" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="700" y="90" width="155" height="150" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="710" y="114" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1b8a9a" font-weight="bold" text-anchor="start"><tspan x="710" dy="0">Merge</tspan></text><text x="710" y="138" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="710" dy="0">Small PRs, human</tspan><tspan x="710" dy="14.3">approval, CODEOWNERS</tspan></text><rect x="20" y="265" width="840" height="105" rx="12" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="36" y="290" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">What to check hardest in AI-written code</tspan></text><text x="36" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Authorization on every object and action (agents often add only login checks)</tspan></text><text x="36" y="331.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="331.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">New dependencies: does the package exist, is it the real one, is it needed?</tspan></text><text x="36" y="351.44000000000005" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="351.44000000000005" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Secrets, tokens and example keys; shell and SQL built from strings; permissive CORS and CSP</tspan></text></svg>