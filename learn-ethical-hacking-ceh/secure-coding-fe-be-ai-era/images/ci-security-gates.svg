<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="450.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="450.0" dy="0">A delivery pipeline with security gates</tspan></text><text x="450.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="450.0" dy="0">Each gate catches a different kind of mistake before it reaches production</tspan></text><rect x="20" y="72" width="205" height="76" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="32" y="96" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">1  Pull request</tspan></text><text x="32" y="118" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Review + branch protection</tspan></text><line x1="227" y1="110" x2="238" y2="110" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="240" y="72" width="205" height="76" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="252" y="96" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="252" dy="0">2  Secret scan</tspan></text><text x="252" y="118" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="252" dy="0">Block keys before merge</tspan></text><line x1="447" y1="110" x2="458" y2="110" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="460" y="72" width="205" height="76" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="472" y="96" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="472" dy="0">3  Install</tspan></text><text x="472" y="118" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">npm ci / lockfile / no</tspan><tspan x="472" dy="13.8">install scripts</tspan></text><line x1="667" y1="110" x2="678" y2="110" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="680" y="72" width="205" height="76" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="692" y="96" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="692" dy="0">4  Dependency scan</tspan></text><text x="692" y="118" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">Known-vulnerable packages</tspan><tspan x="692" dy="13.8">(SCA)</tspan></text><rect x="20" y="164" width="205" height="76" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="32" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">5  Static analysis</tspan></text><text x="32" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Code patterns (SAST)</tspan></text><line x1="227" y1="202" x2="238" y2="202" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="240" y="164" width="205" height="76" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="252" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="252" dy="0">6  Tests</tspan></text><text x="252" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="252" dy="0">Include authorization tests</tspan></text><line x1="447" y1="202" x2="458" y2="202" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="460" y="164" width="205" height="76" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="472" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="472" dy="0">7  Build + image scan</tspan></text><text x="472" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">Minimal, non-root image</tspan></text><line x1="667" y1="202" x2="678" y2="202" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="680" y="164" width="205" height="76" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="692" y="188" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#12304a" font-weight="bold" text-anchor="start"><tspan x="692" dy="0">8  Sign + deploy</tspan></text><text x="692" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">Provenance, then monitor</tspan></text><path d="M862,148 V160 H122 V164" fill="none" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="262" width="860" height="160" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="36" y="286" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">Harden the pipeline itself (it holds your most powerful secrets)</tspan></text><text x="36" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Pin third-party Actions to a full commit SHA (the 2025</tspan><tspan x="50" dy="14.7">tj-actions compromise rewrote version tags)</tspan></text><text x="36" y="349.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="349.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Set workflow permissions to read-only by default</tspan></text><text x="36" y="372.15999999999997" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="372.15999999999997" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Give no secrets to pull requests from forks</tspan></text><text x="450" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="450" dy="0">•</tspan></text><text x="464" y="312" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="464" dy="0">Use OIDC to your cloud instead of long-lived keys</tspan></text><text x="450" y="334.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="450" dy="0">•</tspan></text><text x="464" y="334.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="464" dy="0">Protected branches, required reviews, signed commits</tspan><tspan x="464" dy="14.7">where you can</tspan></text><text x="450" y="372.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="450" dy="0">•</tspan></text><text x="464" y="372.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="464" dy="0">Short-lived registry tokens and trusted publishing</tspan></text></svg>