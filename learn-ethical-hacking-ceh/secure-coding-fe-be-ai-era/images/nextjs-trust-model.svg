<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Where Next.js and React Server Components code runs, and what to distrust</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">The same lessons apply to Remix, React Router, Nuxt and SvelteKit: server code reachable over HTTP is an API</tspan></text><rect x="20" y="82" width="190" height="84" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="115.0" y="120.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="115.0" dy="0">Browser</tspan><tspan x="115.0" dy="15.6">(client components)</tspan></text><rect x="235" y="82" width="190" height="84" rx="10" fill="#eef2f5" stroke="#5b6b79" stroke-width="1.6"/><text x="330.0" y="120.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="330.0" dy="0">CDN / edge</tspan><tspan x="330.0" dy="15.6">middleware</tspan></text><rect x="450" y="82" width="190" height="84" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="545.0" y="104.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="545.0" dy="0">Server</tspan><tspan x="545.0" dy="15.6">(server components,</tspan><tspan x="545.0" dy="15.6">route handlers, server</tspan><tspan x="545.0" dy="15.6">actions)</tspan></text><rect x="665" y="82" width="190" height="84" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="760.0" y="120.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="760.0" dy="0">Database +</tspan><tspan x="760.0" dy="15.6">internal services</tspan></text><line x1="212" y1="124" x2="233" y2="124" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><line x1="427" y1="124" x2="448" y2="124" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><line x1="642" y1="124" x2="663" y2="124" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="190" width="190" height="185" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="30" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Everything here is</tspan><tspan x="30" dy="14.3">public: client code,</tspan><tspan x="30" dy="14.3">source maps, and any</tspan><tspan x="30" dy="14.3">NEXT_PUBLIC_* / VITE_*</tspan><tspan x="30" dy="14.3">variable. Never put</tspan><tspan x="30" dy="14.3">secrets here.</tspan></text><rect x="235" y="190" width="190" height="185" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="245" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="245" dy="0">Middleware is a</tspan><tspan x="245" dy="14.3">convenience, not the only</tspan><tspan x="245" dy="14.3">gate. In 2025 a single</tspan><tspan x="245" dy="14.3">request header could skip</tspan><tspan x="245" dy="14.3">it (CVE-2025-29927).</tspan><tspan x="245" dy="14.3">Authorize again where</tspan><tspan x="245" dy="14.3">data is read.</tspan></text><rect x="450" y="190" width="190" height="185" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="460" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="460" dy="0">Server Actions and route</tspan><tspan x="460" dy="14.3">handlers are public HTTP</tspan><tspan x="460" dy="14.3">endpoints. Authenticate,</tspan><tspan x="460" dy="14.3">authorize and validate</tspan><tspan x="460" dy="14.3">INSIDE each one. Request</tspan><tspan x="460" dy="14.3">parsing is attack</tspan><tspan x="460" dy="14.3">surface: React2Shell</tspan><tspan x="460" dy="14.3">(CVE-2025-55182, CVSS 10)</tspan><tspan x="460" dy="14.3">was remote code</tspan><tspan x="460" dy="14.3">execution.</tspan></text><rect x="665" y="190" width="190" height="185" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="675" y="210" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="675" dy="0">Least-privilege</tspan><tspan x="675" dy="14.3">credentials,</tspan><tspan x="675" dy="14.3">parameterized queries,</tspan><tspan x="675" dy="14.3">and no direct</tspan><tspan x="675" dy="14.3">reachability from the</tspan><tspan x="675" dy="14.3">internet.</tspan></text><rect x="20" y="395" width="840" height="100" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="34" y="418" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">Developer habits that follow</tspan></text><text x="34" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="440" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Keep React, Next.js and other framework packages patched; critical framework bugs are mass-exploited within days.</tspan></text><text x="34" y="460.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="34" dy="0">•</tspan></text><text x="48" y="460.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Treat each server function like a REST endpoint: same checks, same tests.</tspan></text></svg>