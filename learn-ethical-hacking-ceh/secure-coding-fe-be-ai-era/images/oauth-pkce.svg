<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a1b8a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a9a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">OAuth authorization code flow with PKCE</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">The safe way for single-page apps, mobile apps and 'Sign in with...'</tspan></text><rect x="58" y="72" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="130.0" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="130.0" dy="0">Your app</tspan></text><line x1="130" y1="112" x2="130" y2="400" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="358" y="72" width="144" height="40" rx="10" fill="#5b6b79" stroke="#5b6b79" stroke-width="1.6"/><text x="430.0" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Browser</tspan></text><line x1="430" y1="112" x2="430" y2="400" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="658" y="72" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="730.0" y="96.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="730.0" dy="0">Auth server</tspan></text><line x1="730" y1="112" x2="730" y2="400" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="133" y1="135" x2="427" y2="135" stroke="#1b8a9a" stroke-width="2" marker-end="url(#a1b8a9a)"/><text x="280.0" y="126" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">1  app makes code_verifier + code_challenge</tspan></text><line x1="433" y1="175" x2="727" y2="175" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="580.0" y="166" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">2  /authorize?client_id&amp;code_challenge&amp;state</tspan></text><rect x="480" y="192" width="365" height="36" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="662.5" y="206.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="662.5" dy="0">3  user signs in (ideally with a passkey) and</tspan><tspan x="662.5" dy="15.6">consents</tspan></text><line x1="727" y1="262" x2="433" y2="262" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="580.0" y="253" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="580.0" dy="0">4  redirect back with ?code=...&amp;state=...</tspan></text><line x1="427" y1="302" x2="133" y2="302" stroke="#1b8a9a" stroke-width="2" marker-end="url(#a1b8a9a)"/><text x="280.0" y="293" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="280.0" dy="0">5  app receives the code</tspan></text><line x1="133" y1="342" x2="727" y2="342" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="333" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">6  POST /token: code + code_verifier</tspan></text><line x1="727" y1="382" x2="133" y2="382" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="373" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">7  access token (+ refresh token)</tspan></text><rect x="20" y="412" width="405" height="70" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="222.5" y="443.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="222.5" dy="0">A stolen code is useless without the code_verifier</tspan><tspan x="222.5" dy="15.6">that only your app knows. That is what PKCE adds.</tspan></text><rect x="435" y="412" width="405" height="70" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="637.5" y="435.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="637.5" dy="0">Also: check the state value, register exact redirect</tspan><tspan x="637.5" dy="15.6">URIs, keep scopes minimal, and keep tokens short-</tspan><tspan x="637.5" dy="15.6">lived.</tspan></text></svg>