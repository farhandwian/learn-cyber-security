<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="450.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="450.0" dy="0">The secure request pipeline (backend)</tspan></text><text x="450.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="450.0" dy="0">Eight checks every request should pass, in this order</tspan></text><rect x="20" y="72" width="205" height="145" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,106 L20,82 Q20,72 30,72 L215,72 Q225,72 225,82 L225,106 Z" fill="#12304a"/><text x="122.5" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="122.5" dy="0">1  TLS + HSTS</tspan></text><text x="32" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Stops sniffing and</tspan><tspan x="32" dy="16.2">downgrade attacks.</tspan></text><line x1="228" y1="144" x2="237" y2="144" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="240" y="72" width="205" height="145" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M240,106 L240,82 Q240,72 250,72 L435,72 Q445,72 445,82 L445,106 Z" fill="#1b8a9a"/><text x="342.5" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="342.5" dy="0">2  LIMITS</tspan></text><text x="252" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="252" dy="0">Rate limits, body and</tspan><tspan x="252" dy="16.2">upload size caps. Stops</tspan><tspan x="252" dy="16.2">brute force and resource</tspan><tspan x="252" dy="16.2">abuse.</tspan></text><line x1="448" y1="144" x2="457" y2="144" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="460" y="72" width="205" height="145" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M460,106 L460,82 Q460,72 470,72 L655,72 Q665,72 665,82 L665,106 Z" fill="#1b8a9a"/><text x="562.5" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="562.5" dy="0">3  AUTHENTICATE</tspan></text><text x="472" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">Verify the session or</tspan><tspan x="472" dy="16.2">token: signature, expiry,</tspan><tspan x="472" dy="16.2">audience. Stops</tspan><tspan x="472" dy="16.2">impersonation.</tspan></text><line x1="668" y1="144" x2="677" y2="144" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="680" y="72" width="205" height="145" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M680,106 L680,82 Q680,72 690,72 L875,72 Q885,72 885,82 L885,106 Z" fill="#c0392b"/><text x="782.5" y="93.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="782.5" dy="0">4  AUTHORIZE</tspan></text><text x="692" y="127" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">Is THIS user allowed THIS</tspan><tspan x="692" dy="16.2">action on THIS object?</tspan><tspan x="692" dy="16.2">Stops BOLA and BFLA.</tspan></text><rect x="20" y="242" width="205" height="145" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M20,276 L20,252 Q20,242 30,242 L215,242 Q225,242 225,252 L225,276 Z" fill="#1b8a9a"/><text x="122.5" y="263.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="122.5" dy="0">5  VALIDATE</tspan></text><text x="32" y="297" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Schema-check types,</tspan><tspan x="32" dy="16.2">lengths and allowed</tspan><tspan x="32" dy="16.2">fields. Stops injection</tspan><tspan x="32" dy="16.2">and mass assignment.</tspan></text><line x1="228" y1="314" x2="237" y2="314" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="240" y="242" width="205" height="145" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M240,276 L240,252 Q240,242 250,242 L435,242 Q445,242 445,252 L445,276 Z" fill="#2e8b57"/><text x="342.5" y="263.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="342.5" dy="0">6  DO THE WORK</tspan></text><text x="252" y="297" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="252" dy="0">Parameterized queries;</tspan><tspan x="252" dy="16.2">least-privilege database</tspan><tspan x="252" dy="16.2">user. Stops SQL</tspan><tspan x="252" dy="16.2">injection.</tspan></text><line x1="448" y1="314" x2="457" y2="314" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="460" y="242" width="205" height="145" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M460,276 L460,252 Q460,242 470,242 L655,242 Q665,242 665,252 L665,276 Z" fill="#2e8b57"/><text x="562.5" y="263.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="562.5" dy="0">7  RESPOND</tspan></text><text x="472" y="297" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">Return only needed</tspan><tspan x="472" dy="16.2">fields; encode output;</tspan><tspan x="472" dy="16.2">generic errors. Stops</tspan><tspan x="472" dy="16.2">data leaks.</tspan></text><line x1="668" y1="314" x2="677" y2="314" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="680" y="242" width="205" height="145" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><path d="M680,276 L680,252 Q680,242 690,242 L875,242 Q885,242 885,252 L885,276 Z" fill="#c77d0a"/><text x="782.5" y="263.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="782.5" dy="0">8  LOG</tspan></text><text x="692" y="297" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">Record security events,</tspan><tspan x="692" dy="16.2">never secrets. Makes</tspan><tspan x="692" dy="16.2">attacks visible.</tspan></text><path d="M862,220 V232 H122 V240" fill="none" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="395" width="860" height="34" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="450" y="416.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="450" dy="0">Cheap checks first. Authorization before any data access. Every layer assumes the one before it can fail.</tspan></text></svg>