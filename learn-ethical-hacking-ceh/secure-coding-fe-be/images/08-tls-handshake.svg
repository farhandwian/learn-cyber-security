<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 495" width="860" height="495"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">TLS handshake (simplified)</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">What happens between 'connect' and the first encrypted byte</tspan></text><rect x="118" y="75" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="190.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="190.0" dy="0">Browser</tspan></text><line x1="190" y1="115" x2="190" y2="480" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="598" y="75" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="670.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="670.0" dy="0">Server</tspan></text><line x1="670" y1="115" x2="670" y2="480" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="193" y1="150" x2="667" y2="150" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="141" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">1  ClientHello: TLS versions, ciphers, key share</tspan></text><line x1="667" y1="205" x2="193" y2="205" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="196" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">2  ServerHello + certificate + key share</tspan></text><rect x="25" y="228" width="345" height="58" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="197.5" y="253.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="197.5" dy="0">3  Browser verifies the certificate: signed</tspan><tspan x="197.5" dy="15.6">by a trusted CA? Right domain? Not expired?</tspan></text><rect x="480" y="228" width="355" height="58" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="657.5" y="253.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="657.5" dy="0">A man-in-the-middle cannot present a valid</tspan><tspan x="657.5" dy="15.6">certificate for the domain, so step 3 fails.</tspan></text><rect x="110" y="315" width="640" height="40" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="430.0" y="331.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">4  Both sides now compute the same secret session key (it is never sent over the</tspan><tspan x="430.0" dy="16.2">wire)</tspan></text><line x1="193" y1="410" x2="667" y2="410" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)" marker-start="url(#a2e8b57)"/><text x="430.0" y="401" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">5  Encrypted HTTP traffic (fast symmetric encryption)</tspan></text></svg>