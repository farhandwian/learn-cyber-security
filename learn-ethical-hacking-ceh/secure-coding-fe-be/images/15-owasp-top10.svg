<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 502" width="905" height="502"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="452.5" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="452.5" dy="0">OWASP Top 10 (2025) at a glance</tspan></text><text x="452.5" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="452.5" dy="0">Memorize the names; know one fix for each</tspan></text><rect x="20" y="70" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,138 L20,80 Q20,70 30,70 L175,70 Q185,70 185,80 L185,138 Z" fill="#12304a"/><text x="30" y="87" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">A01</tspan></text><text x="30" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Broken Access Control</tspan></text><text x="30" y="160" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Users do or see what</tspan><tspan x="30" dy="14.3">they should not</tspan><tspan x="30" dy="14.3">(IDOR, SSRF).</tspan></text><rect x="26" y="208" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="32" y="223" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">FIX: Check permissions</tspan><tspan x="32" dy="13.1">on the server, every</tspan><tspan x="32" dy="13.1">request.</tspan></text><rect x="195" y="70" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M195,138 L195,80 Q195,70 205,70 L350,70 Q360,70 360,80 L360,138 Z" fill="#12304a"/><text x="205" y="87" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">A02</tspan></text><text x="205" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">Security</tspan><tspan x="205" dy="13.8">Misconfiguration</tspan></text><text x="205" y="160" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="205" dy="0">Default passwords,</tspan><tspan x="205" dy="14.3">open cloud buckets,</tspan><tspan x="205" dy="14.3">debug mode on.</tspan></text><rect x="201" y="208" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="207" y="223" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="207" dy="0">FIX: Hardened,</tspan><tspan x="207" dy="13.1">repeatable</tspan><tspan x="207" dy="13.1">configuration.</tspan></text><rect x="370" y="70" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M370,138 L370,80 Q370,70 380,70 L525,70 Q535,70 535,80 L535,138 Z" fill="#12304a"/><text x="380" y="87" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">A03</tspan></text><text x="380" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">Software Supply Chain</tspan><tspan x="380" dy="13.8">Failures</tspan></text><rect x="487.36" y="72.5" width="35.28" height="19" rx="9.5" fill="#c77d0a"/><text x="505" y="85.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="505" dy="0">NEW</tspan></text><text x="380" y="160" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="380" dy="0">A poisoned</tspan><tspan x="380" dy="14.3">dependency, build</tspan><tspan x="380" dy="14.3">system or update.</tspan></text><rect x="376" y="208" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="382" y="223" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="382" dy="0">FIX: Pin, scan and</tspan><tspan x="382" dy="13.1">verify what you depend</tspan><tspan x="382" dy="13.1">on.</tspan></text><rect x="545" y="70" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M545,138 L545,80 Q545,70 555,70 L700,70 Q710,70 710,80 L710,138 Z" fill="#12304a"/><text x="555" y="87" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">A04</tspan></text><text x="555" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">Cryptographic</tspan><tspan x="555" dy="13.8">Failures</tspan></text><text x="555" y="160" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="555" dy="0">No or weak</tspan><tspan x="555" dy="14.3">encryption, leaked</tspan><tspan x="555" dy="14.3">keys, weak hashing.</tspan></text><rect x="551" y="208" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="557" y="223" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="557" dy="0">FIX: TLS, strong</tspan><tspan x="557" dy="13.1">algorithms, key</tspan><tspan x="557" dy="13.1">management.</tspan></text><rect x="720" y="70" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M720,138 L720,80 Q720,70 730,70 L875,70 Q885,70 885,80 L885,138 Z" fill="#12304a"/><text x="730" y="87" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">A05</tspan></text><text x="730" y="104" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">Injection</tspan></text><text x="730" y="160" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="730" dy="0">Untrusted input runs</tspan><tspan x="730" dy="14.3">as code (SQLi, XSS,</tspan><tspan x="730" dy="14.3">command).</tspan></text><rect x="726" y="208" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="732" y="223" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="732" dy="0">FIX: Parameterized</tspan><tspan x="732" dy="13.1">queries, output</tspan><tspan x="732" dy="13.1">encoding.</tspan></text><rect x="20" y="275" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,343 L20,285 Q20,275 30,275 L175,275 Q185,275 185,285 L185,343 Z" fill="#12304a"/><text x="30" y="292" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">A06</tspan></text><text x="30" y="309" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">Insecure Design</tspan></text><text x="30" y="365" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">The design itself is</tspan><tspan x="30" dy="14.3">flawed, not a coding</tspan><tspan x="30" dy="14.3">slip.</tspan></text><rect x="26" y="413" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="32" y="428" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="32" dy="0">FIX: Threat-model</tspan><tspan x="32" dy="13.1">before you build.</tspan></text><rect x="195" y="275" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M195,343 L195,285 Q195,275 205,275 L350,275 Q360,275 360,285 L360,343 Z" fill="#12304a"/><text x="205" y="292" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">A07</tspan></text><text x="205" y="309" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="205" dy="0">Authentication</tspan><tspan x="205" dy="13.8">Failures</tspan></text><text x="205" y="365" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="205" dy="0">Weak login,</tspan><tspan x="205" dy="14.3">credential stuffing,</tspan><tspan x="205" dy="14.3">bad sessions.</tspan></text><rect x="201" y="413" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="207" y="428" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="207" dy="0">FIX: MFA, rate</tspan><tspan x="207" dy="13.1">limiting, slow salted</tspan><tspan x="207" dy="13.1">hashes.</tspan></text><rect x="370" y="275" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M370,343 L370,285 Q370,275 380,275 L525,275 Q535,275 535,285 L535,343 Z" fill="#12304a"/><text x="380" y="292" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">A08</tspan></text><text x="380" y="309" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="380" dy="0">Software or Data</tspan><tspan x="380" dy="13.8">Integrity Failures</tspan></text><text x="380" y="365" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="380" dy="0">Trusting unsigned</tspan><tspan x="380" dy="14.3">code or data.</tspan></text><rect x="376" y="413" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="382" y="428" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="382" dy="0">FIX: Verify signatures</tspan><tspan x="382" dy="13.1">and integrity.</tspan></text><rect x="545" y="275" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M545,343 L545,285 Q545,275 555,275 L700,275 Q710,275 710,285 L710,343 Z" fill="#12304a"/><text x="555" y="292" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">A09</tspan></text><text x="555" y="309" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="555" dy="0">Security Logging and</tspan><tspan x="555" dy="13.8">Alerting Failures</tspan></text><text x="555" y="365" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="555" dy="0">Attacks happen and</tspan><tspan x="555" dy="14.3">nobody notices.</tspan></text><rect x="551" y="413" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="557" y="428" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="557" dy="0">FIX: Log security</tspan><tspan x="557" dy="13.1">events, alert on</tspan><tspan x="557" dy="13.1">anomalies.</tspan></text><rect x="720" y="275" width="165" height="195" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M720,343 L720,285 Q720,275 730,275 L875,275 Q885,275 885,285 L885,343 Z" fill="#12304a"/><text x="730" y="292" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#9fd3dc" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">A10</tspan></text><text x="730" y="309" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="start"><tspan x="730" dy="0">Mishandling of</tspan><tspan x="730" dy="13.8">Exceptional</tspan><tspan x="730" dy="13.8">Conditions</tspan></text><rect x="837.36" y="277.5" width="35.28" height="19" rx="9.5" fill="#c77d0a"/><text x="855" y="290.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="855" dy="0">NEW</tspan></text><text x="730" y="365" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="730" dy="0">Errors handled badly;</tspan><tspan x="730" dy="14.3">the system fails</tspan><tspan x="730" dy="14.3">open.</tspan></text><rect x="726" y="413" width="153" height="51" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="732" y="428" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="732" dy="0">FIX: Fail closed;</tspan><tspan x="732" dy="13.1">handle every error</tspan><tspan x="732" dy="13.1">path.</tspan></text><text x="20" y="494" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="start"><tspan x="20" dy="0">2025 edition: SSRF was merged into A01. Source: top10.owasp.org/2025</tspan></text></svg>