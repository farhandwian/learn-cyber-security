<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" width="860" height="458"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">SQL injection: why parameterized queries fix it</tspan></text><rect x="15" y="45" width="830" height="190" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><rect x="31.879999999999995" y="51.5" width="236.24" height="21" rx="10.5" fill="#c0392b"/><text x="150" y="65.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="150" dy="0">UNSAFE: gluing strings together</tspan></text><text x="30" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">User types</tspan></text><rect x="30" y="108" width="215" height="46" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="137.5" y="135.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="137.5" dy="0">' OR '1'='1</tspan></text><line x1="247" y1="131" x2="277" y2="131" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="280" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="280" dy="0">Code builds the query</tspan></text><rect x="280" y="108" width="265" height="66" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="412.5" y="137.7" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="412.5" dy="0">"SELECT * FROM users WHERE name = '"</tspan><tspan x="412.5" dy="14.3">+ input + "'"</tspan></text><line x1="547" y1="141" x2="577" y2="141" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="580" y="100" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="580" dy="0">Database receives</tspan></text><rect x="580" y="108" width="250" height="66" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="705.0" y="137.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="705.0" dy="0">... WHERE name = ''</tspan><tspan x="705.0" dy="15.0">    OR '1'='1'</tspan></text><text x="30" y="208" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">The input changed the STRUCTURE of the query. '1'='1' is always true, so the database returns every row.</tspan></text><rect x="15" y="248" width="830" height="195" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><rect x="53.0" y="254.5" width="194.0" height="21" rx="10.5" fill="#2e8b57"/><text x="150" y="268.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="150" dy="0">SAFE: parameterized query</tspan></text><text x="30" y="303" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">User types</tspan></text><rect x="30" y="311" width="215" height="46" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="137.5" y="338.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="137.5" dy="0">' OR '1'='1</tspan></text><line x1="247" y1="334" x2="277" y2="334" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="280" y="303" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="280" dy="0">Code sends query and value separately</tspan></text><rect x="280" y="311" width="265" height="66" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="412.5" y="333.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="412.5" dy="0">query: "SELECT * FROM users WHERE</tspan><tspan x="412.5" dy="14.3">name = ?"</tspan><tspan x="412.5" dy="14.3">value: input</tspan></text><line x1="547" y1="344" x2="577" y2="344" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="580" y="303" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#5b6b79" font-weight="bold" text-anchor="start"><tspan x="580" dy="0">Database receives</tspan></text><rect x="580" y="311" width="250" height="66" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="705.0" y="340.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="705.0" dy="0">Query shape is FIXED.</tspan><tspan x="705.0" dy="15.6">Input is only a value.</tspan></text><text x="30" y="411" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="30" dy="0">The database never parses the input as SQL. It looks for a user literally named ' OR '1'='1 and finds</tspan><tspan x="30" dy="16.2">none.</tspan></text></svg>