<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a1b8a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a9a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">The BFF pattern: keep OAuth tokens out of the browser</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">BFF = Backend For Frontend, a small server that fronts your single-page app</tspan></text><rect x="20" y="140" width="170" height="100" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="105.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="105.0" dy="0">Browser SPA</tspan><tspan x="105.0" dy="15.6">holds only a session</tspan><tspan x="105.0" dy="15.6">cookie</tspan><tspan x="105.0" dy="15.6">(HttpOnly, Secure,</tspan><tspan x="105.0" dy="15.6">SameSite)</tspan></text><rect x="290" y="120" width="230" height="140" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="405.0" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="405.0" dy="0">BFF (your server)</tspan><tspan x="405.0" dy="15.6">holds access + refresh tokens</tspan><tspan x="405.0" dy="15.6">checks CSRF and Origin</tspan><tspan x="405.0" dy="15.6">attaches the token to API</tspan><tspan x="405.0" dy="15.6">calls</tspan></text><rect x="630" y="85" width="210" height="70" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><text x="735.0" y="116.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="735.0" dy="0">Your APIs</tspan><tspan x="735.0" dy="16.2">(resource servers)</tspan></text><rect x="630" y="225" width="210" height="70" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><text x="735.0" y="256.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="735.0" dy="0">Identity provider</tspan><tspan x="735.0" dy="16.2">(OAuth / OIDC)</tspan></text><line x1="192" y1="190" x2="288" y2="190" stroke="#1b8a9a" stroke-width="2" marker-end="url(#a1b8a9a)"/><text x="240" y="178" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="240" dy="0">cookie</tspan></text><line x1="522" y1="120" x2="628" y2="120" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="575" y="108" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="575" dy="0">access token</tspan></text><line x1="522" y1="250" x2="628" y2="250" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><text x="575" y="238" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="575" dy="0">code + refresh</tspan></text><rect x="20" y="320" width="820" height="70" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="351.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">XSS cannot steal a token the browser never had. You pay for it with one extra server to run, but you</tspan><tspan x="430" dy="16.2">remove the single most valuable thing an injected script could take.</tspan></text></svg>