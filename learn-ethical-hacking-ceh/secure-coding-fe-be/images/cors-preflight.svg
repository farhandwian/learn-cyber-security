<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">CORS in one picture: the browser enforces it, not your server</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Preflight happens for non-simple requests (custom headers, JSON, PUT/DELETE)</tspan></text><rect x="98" y="75" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="170.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="170.0" dy="0">app.example.com</tspan></text><line x1="170" y1="115" x2="170" y2="330" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="618" y="75" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="690.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="690.0" dy="0">api.example.com</tspan></text><line x1="690" y1="115" x2="690" y2="330" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="173" y1="140" x2="687" y2="140" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="131" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">1  OPTIONS /orders (preflight)  Origin: https://app.example.com</tspan></text><line x1="687" y1="185" x2="173" y2="185" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="176" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">2  Allow-Origin: app.example.com, Allow-Methods, Allow-Headers</tspan></text><line x1="173" y1="235" x2="687" y2="235" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="226" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">3  The real request (cookies sent only if credentials are enabled)</tspan></text><line x1="687" y1="280" x2="173" y2="280" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="271" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">4  Response: the browser lets the page's JavaScript read it only if allowed</tspan></text><rect x="20" y="350" width="405" height="64" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="222.5" y="371.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="222.5" dy="0">CORS is enforced by the BROWSER. curl, Postman and an</tspan><tspan x="222.5" dy="15.0">attacker's own server ignore it. It protects users'</tspan><tspan x="222.5" dy="15.0">browsers; it is not authentication or access control.</tspan></text><rect x="435" y="350" width="405" height="64" rx="10" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="637.5" y="363.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="637.5" dy="0">Never reflect any Origin back while allowing</tspan><tspan x="637.5" dy="15.0">credentials. Browsers refuse the * wildcard together</tspan><tspan x="637.5" dy="15.0">with cookies, so people "fix" it by reflecting. That is</tspan><tspan x="637.5" dy="15.0">the bug.</tspan></text><rect x="20" y="425" width="820" height="36" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="430" y="439.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">A request can reach your server even when CORS blocks the response. Simple form POSTs skip the preflight</tspan><tspan x="430" dy="15.6">entirely.</tspan></text></svg>