<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="450.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="450.0" dy="0">Where should a single-page app keep its login?</tspan></text><text x="450.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="450.0" dy="0">Four options, from weakest to strongest</tspan></text><rect x="20" y="75" width="205" height="270" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M20,129 L20,85 Q20,75 30,75 L215,75 Q225,75 225,85 L225,129 Z" fill="#c0392b"/><text x="122.5" y="97.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="122.5" dy="0">localStorage /</tspan><tspan x="122.5" dy="18.2">sessionStorage</tspan></text><text x="32" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">Readable by any script on</tspan><tspan x="32" dy="15.5">the page, so one XSS flaw</tspan><tspan x="32" dy="15.5">hands over the token to be</tspan><tspan x="32" dy="15.5">used anywhere.</tspan></text><rect x="28" y="245" width="189" height="52" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="36" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">XSS can steal it: YES</tspan></text><rect x="28" y="305" width="189" height="32" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.6"/><text x="122" y="325.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="122" dy="0">Avoid for real tokens</tspan></text><rect x="240" y="75" width="205" height="270" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><path d="M240,129 L240,85 Q240,75 250,75 L435,75 Q445,75 445,85 L445,129 Z" fill="#c77d0a"/><text x="342.5" y="88.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="342.5" dy="0">Short-lived token in</tspan><tspan x="342.5" dy="18.2">memory + HttpOnly</tspan><tspan x="342.5" dy="18.2">refresh cookie</tspan></text><text x="252" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="252" dy="0">The access token lives</tspan><tspan x="252" dy="15.5">only in JS memory. The</tspan><tspan x="252" dy="15.5">refresh token sits in a</tspan><tspan x="252" dy="15.5">cookie scripts cannot</tspan><tspan x="252" dy="15.5">read. Rotate it.</tspan></text><rect x="248" y="245" width="189" height="52" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="256" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="256" dy="0">XSS can steal it: NO (can</tspan><tspan x="256" dy="13.1">still use it while the page</tspan><tspan x="256" dy="13.1">is open)</tspan></text><rect x="248" y="305" width="189" height="32" rx="6" fill="#c77d0a" stroke="#c77d0a" stroke-width="1.6"/><text x="342" y="325.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="342" dy="0">A good SPA default</tspan></text><rect x="460" y="75" width="205" height="270" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M460,129 L460,85 Q460,75 470,75 L655,75 Q665,75 665,85 L665,129 Z" fill="#2e8b57"/><text x="562.5" y="97.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="562.5" dy="0">HttpOnly session</tspan><tspan x="562.5" dy="18.2">cookie (same site)</tspan></text><text x="472" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">A server-side session. The</tspan><tspan x="472" dy="15.5">browser sends the cookie</tspan><tspan x="472" dy="15.5">automatically. Needs</tspan><tspan x="472" dy="15.5">SameSite and CSRF</tspan><tspan x="472" dy="15.5">defences.</tspan></text><rect x="468" y="245" width="189" height="52" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="476" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="476" dy="0">XSS can steal it: NO (can</tspan><tspan x="476" dy="13.1">still act as the user)</tspan></text><rect x="468" y="305" width="189" height="32" rx="6" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.6"/><text x="562" y="325.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="562" dy="0">Simple and robust</tspan></text><rect x="680" y="75" width="205" height="270" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M680,129 L680,85 Q680,75 690,75 L875,75 Q885,75 885,85 L885,129 Z" fill="#1b8a9a"/><text x="782.5" y="97.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="782.5" dy="0">BFF: tokens never</tspan><tspan x="782.5" dy="18.2">reach the browser</tspan></text><text x="692" y="150" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="692" dy="0">A small backend holds the</tspan><tspan x="692" dy="15.5">OAuth tokens. The browser</tspan><tspan x="692" dy="15.5">has only a session cookie</tspan><tspan x="692" dy="15.5">to the BFF.</tspan></text><rect x="688" y="245" width="189" height="52" rx="6" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="696" y="262" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="bold" text-anchor="start"><tspan x="696" dy="0">XSS can steal tokens: there</tspan><tspan x="696" dy="13.1">are none to steal</tspan></text><rect x="688" y="305" width="189" height="32" rx="6" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="782" y="325.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="782" dy="0">Best for high-value apps</tspan></text><rect x="20" y="362" width="860" height="62" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="450" y="389.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="450" dy="0">No storage choice is safe if XSS exists: an attacker script can still USE the session while the page is open. Fix</tspan><tspan x="450" dy="15.6">XSS first, then choose storage so that a foothold is worth as little as possible.</tspan></text></svg>