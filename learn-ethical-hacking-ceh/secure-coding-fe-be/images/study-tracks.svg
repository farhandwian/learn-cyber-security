<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a5b6b79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b79"/></marker></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">Your four weeks: shared core, then both tracks, then delivery</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">About 10 hours a week, evenings plus the weekend</tspan></text><rect x="20" y="80" width="200" height="250" rx="10" fill="#ffffff" stroke="#12304a" stroke-width="1.6"/><path d="M20,130 L20,90 Q20,80 30,80 L210,80 Q220,80 220,90 L220,130 Z" fill="#12304a"/><text x="120.0" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="120.0" dy="0">WEEK 1</tspan><tspan x="120.0" dy="18.2">Shared core</tspan></text><text x="32" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="32" dy="0">• Threat model for</tspan><tspan x="32" dy="16.2">developers</tspan><tspan x="32" dy="16.2">• Browser and HTTP</tspan><tspan x="32" dy="16.2">security</tspan><tspan x="32" dy="16.2">• Authentication and</tspan><tspan x="32" dy="16.2">sessions</tspan></text><rect x="235" y="80" width="200" height="250" rx="10" fill="#ffffff" stroke="#1b8a9a" stroke-width="1.6"/><path d="M235,130 L235,90 Q235,80 245,80 L425,80 Q435,80 435,90 L435,130 Z" fill="#1b8a9a"/><text x="335.0" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="335.0" dy="0">WEEK 2</tspan><tspan x="335.0" dy="18.2">AuthZ and input</tspan></text><text x="247" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="247" dy="0">• Authorization and API</tspan><tspan x="247" dy="16.2">design</tspan><tspan x="247" dy="16.2">• Injection and input</tspan><tspan x="247" dy="16.2">handling</tspan><tspan x="247" dy="16.2">• Labs 1, 3, 4, 5</tspan></text><rect x="450" y="80" width="200" height="115" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><path d="M450,114 L450,90 Q450,80 460,80 L640,80 Q650,80 650,90 L650,114 Z" fill="#c0392b"/><text x="550.0" y="101.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="550.0" dy="0">WEEK 3a  Frontend</tspan></text><text x="462" y="135" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="462" dy="0">• XSS, CSP, tokens</tspan><tspan x="462" dy="16.2">• Next.js / RSC risks</tspan></text><rect x="450" y="215" width="200" height="115" rx="10" fill="#ffffff" stroke="#c77d0a" stroke-width="1.6"/><path d="M450,249 L450,225 Q450,215 460,215 L640,215 Q650,215 650,225 L650,249 Z" fill="#c77d0a"/><text x="550.0" y="236.9" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="550.0" dy="0">WEEK 3b  Backend</tspan></text><text x="462" y="270" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="462" dy="0">• SSRF, uploads,</tspan><tspan x="462" dy="16.2">webhooks</tspan><tspan x="462" dy="16.2">• Secrets, errors,</tspan><tspan x="462" dy="16.2">containers</tspan></text><rect x="665" y="80" width="195" height="250" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><path d="M665,130 L665,90 Q665,80 675,80 L850,80 Q860,80 860,90 L860,130 Z" fill="#2e8b57"/><text x="762.5" y="100.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="762.5" dy="0">WEEK 4</tspan><tspan x="762.5" dy="18.2">Delivery + interview</tspan></text><text x="677" y="151" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="677" dy="0">• Supply chain and</tspan><tspan x="677" dy="16.2">CI/CD</tspan><tspan x="677" dy="16.2">• AI features</tspan><tspan x="677" dy="16.2">• Code review drill</tspan><tspan x="677" dy="16.2">• 50-question mock</tspan></text><line x1="222" y1="205" x2="233" y2="205" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><line x1="437" y1="205" x2="448" y2="205" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><line x1="652" y1="205" x2="663" y2="205" stroke="#5b6b79" stroke-width="2" marker-end="url(#a5b6b79)"/><rect x="20" y="345" width="840" height="40" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="440" y="361.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">Frontend engineer? Do 3a deeply and skim 3b. Backend engineer? The reverse. Full-stack? Do both and skip</tspan><tspan x="440" dy="16.2">nothing in Week 2.</tspan></text></svg>