<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ac77d0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77d0a"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Trust boundaries: the browser is outside your control</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Everything that crosses the line must be checked again on the server</tspan></text><rect x="20" y="75" width="262" height="265" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="151" y="98" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="151" dy="0">BROWSER (untrusted)</tspan></text><text x="36" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">JavaScript checks and disabled</tspan><tspan x="50" dy="14.7">buttons</tspan></text><text x="36" y="161.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="161.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Hidden form fields and URL</tspan><tspan x="50" dy="14.7">parameters</tspan></text><text x="36" y="198.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="198.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">localStorage and cookies it holds</tspan></text><text x="36" y="221.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="221.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">The payload inside a JWT</tspan></text><text x="36" y="244.32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="244.32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Request headers and uploaded</tspan><tspan x="50" dy="14.7">files</tspan></text><text x="36" y="281.76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="281.76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Any request, from any tool, not</tspan><tspan x="50" dy="14.7">just your UI</tspan></text><line x1="311" y1="75" x2="311" y2="340" stroke="#c77d0a" stroke-width="2" stroke-dasharray="6 4"/><text x="311" y="70" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="311" dy="0">TRUST BOUNDARY</tspan></text><rect x="340" y="75" width="300" height="265" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="490" y="98" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="490" dy="0">YOUR BACKEND (trusted)</tspan></text><rect x="362" y="125" width="120" height="54" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="422.0" y="156.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="422.0" dy="0">API handlers</tspan></text><rect x="498" y="125" width="120" height="54" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="558.0" y="148.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="558.0" dy="0">Auth + policy</tspan><tspan x="558.0" dy="15.6">layer</tspan></text><rect x="362" y="235" width="120" height="54" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="422.0" y="250.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="422.0" dy="0">Database</tspan><tspan x="422.0" dy="15.6">(least</tspan><tspan x="422.0" dy="15.6">privilege)</tspan></text><rect x="498" y="235" width="120" height="54" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/><text x="558.0" y="258.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="558.0" dy="0">Secrets +</tspan><tspan x="558.0" dy="15.6">config</tspan></text><line x1="284" y1="152" x2="360" y2="152" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><text x="322" y="142" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="322" dy="0">hostile</tspan></text><line x1="422" y1="181" x2="422" y2="233" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><rect x="668" y="75" width="172" height="265" rx="12" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6" stroke-dasharray="6 4"/><text x="754" y="98" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#c77d0a" font-weight="bold" text-anchor="middle"><tspan x="754" dy="0">THIRD PARTIES</tspan></text><text x="682" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="682" dy="0">•</tspan></text><text x="696" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="696" dy="0">Payments</tspan></text><text x="682" y="146.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="682" dy="0">•</tspan></text><text x="696" y="146.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="696" dy="0">Analytics and tag</tspan><tspan x="696" dy="14.7">managers</tspan></text><text x="682" y="184.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="682" dy="0">•</tspan></text><text x="696" y="184.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="696" dy="0">Identity provider</tspan></text><text x="682" y="206.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="682" dy="0">•</tspan></text><text x="696" y="206.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="696" dy="0">CDN-hosted scripts</tspan></text><text x="682" y="229.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c77d0a" font-weight="bold" text-anchor="start"><tspan x="682" dy="0">•</tspan></text><text x="696" y="229.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="696" dy="0">SaaS integrations</tspan></text><text x="754" y="296" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="754" dy="0">Partly trusted:</tspan><tspan x="754" dy="14.3">limit what they can reach</tspan></text><line x1="642" y1="152" x2="666" y2="152" stroke="#c77d0a" stroke-width="2" marker-end="url(#ac77d0a)"/><rect x="20" y="360" width="820" height="70" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="430" y="391.1" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="430" dy="0">Frontend validation is user experience. Backend validation is security. You need both, but only the</tspan><tspan x="430" dy="16.9">second one counts against an attacker.</tspan></text></svg>