<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a12304a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12304a"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker></defs><text x="430.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="430.0" dy="0">Webhook verification: trust the signature, not the URL</tspan></text><text x="430.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">Anyone who finds your webhook URL can send a fake 'payment succeeded' unless you check</tspan></text><rect x="98" y="75" width="144" height="40" rx="10" fill="#1b8a9a" stroke="#1b8a9a" stroke-width="1.6"/><text x="170.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="170.0" dy="0">Provider</tspan></text><line x1="170" y1="115" x2="170" y2="345" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="618" y="75" width="144" height="40" rx="10" fill="#12304a" stroke="#12304a" stroke-width="1.6"/><text x="690.0" y="99.7" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle"><tspan x="690.0" dy="0">Your server</tspan></text><line x1="690" y1="115" x2="690" y2="345" stroke="#5b6b79" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="130" width="345" height="48" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="192.5" y="150.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="192.5" dy="0">signature = HMAC-SHA256(secret, timestamp +</tspan><tspan x="192.5" dy="15.0">"." + rawBody)</tspan></text><line x1="173" y1="215" x2="687" y2="215" stroke="#12304a" stroke-width="2" marker-end="url(#a12304a)"/><text x="430.0" y="206" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">POST /webhook  body + X-Timestamp + X-Signature</tspan></text><rect x="430" y="240" width="410" height="78" rx="10" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="635.0" y="260.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="635.0" dy="0">1  Use the RAW body (not re-serialized JSON)</tspan><tspan x="635.0" dy="15.0">2  Recompute the HMAC</tspan><tspan x="635.0" dy="15.0">3  Compare in constant time</tspan><tspan x="635.0" dy="15.0">4  Reject old timestamps (replay)</tspan></text><line x1="687" y1="345" x2="173" y2="345" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="430.0" y="336" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="430.0" dy="0">200 if valid, 401 if not (and do not run the handler)</tspan></text><rect x="20" y="372" width="405" height="90" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="222.5" y="405.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="222.5" dy="0">Also: make the handler idempotent (providers retry, so</tspan><tspan x="222.5" dy="15.6">the same event can arrive twice) and acknowledge</tspan><tspan x="222.5" dy="15.6">quickly; do slow work in a queue.</tspan></text><rect x="435" y="372" width="405" height="90" rx="10" fill="#e6f3f7" stroke="#1b8a9a" stroke-width="1.6"/><text x="637.5" y="397.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="middle"><tspan x="637.5" dy="0">Keep the signing secret in your secrets manager and</tspan><tspan x="637.5" dy="15.6">rotate it. If you cannot verify a signature, fetch the</tspan><tspan x="637.5" dy="15.6">event from the provider's API instead of trusting the</tspan><tspan x="637.5" dy="15.6">payload.</tspan></text></svg>