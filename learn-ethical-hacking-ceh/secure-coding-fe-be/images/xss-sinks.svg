<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="440.0" y="32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" fill="#12304a" font-weight="bold" text-anchor="middle"><tspan x="440.0" dy="0">XSS sinks every frontend developer should recognise</tspan></text><text x="440.0" y="54" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12.5" fill="#5b6b79" font-weight="normal" text-anchor="middle"><tspan x="440.0" dy="0">Frameworks escape by default. These are the doors that switch it off.</tspan></text><rect x="20" y="75" width="300" height="270" rx="12" fill="#e7f5ec" stroke="#2e8b57" stroke-width="1.6"/><text x="170" y="98" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#2e8b57" font-weight="bold" text-anchor="middle"><tspan x="170" dy="0">SAFE BY DEFAULT</tspan></text><text x="36" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="124" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">React / JSX:  {value}</tspan></text><text x="36" y="149.36" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="149.36" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Vue:  {{ value }}</tspan></text><text x="36" y="174.72000000000003" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="174.72000000000003" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Angular:  {{ value }} interpolation</tspan></text><text x="36" y="200.08000000000004" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="200.08000000000004" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">DOM:  element.textContent = value</tspan></text><text x="36" y="225.44000000000005" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#2e8b57" font-weight="bold" text-anchor="start"><tspan x="36" dy="0">•</tspan></text><text x="50" y="225.44000000000005" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Template engines with autoescape on</tspan></text><rect x="345" y="75" width="515" height="270" rx="12" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/><text x="602" y="98" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13.5" fill="#c0392b" font-weight="bold" text-anchor="middle"><tspan x="602" dy="0">DANGEROUS SINKS (review every use)</tspan></text><text x="361" y="124" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="124" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">dangerouslySetInnerHTML  (React)</tspan></text><text x="361" y="146.72" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="146.72" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">innerHTML, outerHTML, insertAdjacentHTML</tspan></text><text x="361" y="169.44" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="169.44" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">v-html (Vue),  [innerHTML] (Angular)</tspan></text><text x="361" y="192.16" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="192.16" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">document.write(...)</tspan></text><text x="361" y="214.88" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="214.88" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">eval(...), new Function(...), setTimeout("string")</tspan></text><text x="361" y="237.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="237.6" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">href / src set from user input  (javascript: URLs)</tspan></text><text x="361" y="260.32" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="260.32" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">location = userInput, window.open(userInput)  (open redirect)</tspan></text><text x="361" y="283.03999999999996" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="283.03999999999996" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">onclick=... attributes built from data</tspan></text><text x="361" y="305.76" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="start"><tspan x="361" dy="0">•</tspan></text><text x="375" y="305.76" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.5" fill="#1a1a1a" font-weight="normal" text-anchor="start"><tspan x="375" dy="0">message handlers with no event.origin check</tspan></text><rect x="20" y="360" width="840" height="40" rx="10" fill="#fdf3e0" stroke="#c77d0a" stroke-width="1.6"/><text x="440" y="376.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">If you must render HTML, sanitize it with DOMPurify. If you accept URLs, allowlist http, https and mailto. If</tspan><tspan x="440" dy="15.6">you listen to postMessage, check the origin.</tspan></text></svg>